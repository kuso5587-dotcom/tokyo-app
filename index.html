.tabbar{display:flex;border-top:1.5px solid #E0D5C5;}
.tabbar button{flex:1;padding:8px 1px;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;color:#9A8F7E;cursor:pointer;border-top:2px solid transparent;margin-top:-1.5px;transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}

/* content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));position:relative;z-index:1;}
.sec{display:flex;align-items:center;gap:10px;font-family:'Zen Dots',cursive;font-size:9px;color:#C84B31;letter-spacing:2px;margin:18px 0 10px;}

.scard{background:#FDFAF5;border:1px solid #E8DFD0;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .12s,border-color .12s;-webkit-tap-highlight-color:transparent;}

.scard:not(.added):active::before{background:#C84B31;}
.hot-badge{position:absolute;top:9px;right:9px;background:#C84B31;color:#fff;font-family:'Zen Dots',cursive;font-size:8px;padding:2px 7px;border-radius:4px;}
.sico{width:42px;height:42px;border-radius:12px;background:#F0EBE0;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:1px solid #E0D5C0;}
.tip{background:#F0EBE0;border-radius:8px;padding:7px 10px;font-size:11px;color:#6B5D4A;margin-top:8px;line-height:1.6;border-left:2.5px solid #C84B31;}
.sw{font-size:10px;color:#8B7355;margin-top:5px;font-weight:500;}

.btn-red{display:inline-flex;align-items:center;justify-content:center;background:#C84B31;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;box-shadow:0 3px 12px #C84B3140;-webkit-tap-highlight-color:transparent;transition:filter .1s;}

.btn-sm{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;font-size:11px;background:#F0EBE0;color:#6B5D4A;border-radius:6px;border:1px solid #E0D5C0;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-sm.active{background:#C84B31;color:#fff;border-color:#C84B31;}
.btn-danger{background:#FFF0EE;color:#C84B31;border:1px solid #F0D0C8;padding:5px 10px;font-size:11px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent;}

.inp::placeholder{color:#B0A090;}
select.inp{cursor:pointer;background-image:none;}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}

.pbar-track{height:6px;background:#EDE6D8;border-radius:3px;margin-top:5px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.bp{background:#FDFAF5;border-radius:16px;overflow:hidden;margin-bottom:12px;}
.bp-dashed{margin:12px 0;border-top:1.5px dashed #E0D5C5;position:relative;}

.bp-dashed::after{content:'';position:absolute;top:-8px;right:-1px;width:16px;height:16px;border-radius:50%;background:#F5F0E8;border:1.5px solid #E0D5C5;}

/* loading screen */
.loading-screen{position:fixed;inset:0;background:#F5F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.loading-logo{font-family:'Zen Dots',cursive;font-size:26px;color:#1A1008;letter-spacing:2px;}

.loading-bar{width:180px;height:2px;background:#E8DFD0;border-radius:2px;overflow:hidden;}
.loading-fill{height:100%;background:linear-gradient(90deg,#C84B31,#e8836a,#C84B31);background-size:200% 100%;border-radius:2px;animation:loadfill 3s ease-in-out infinite;}
.loading-txt{font-family:'Zen Dots',cursive;font-size:9px;color:#B0A090;letter-spacing:3px;animation:fadepulse 2s ease-in-out infinite;}
.loading-sub{font-family:'Noto Serif JP',serif;font-size:11px;color:#C84B31;letter-spacing:1px;opacity:.7;margin-top:-8px;animation:fadepulse 2.5s ease-in-out infinite;}
@keyframes loadfill{0%{background-position:100% 0;}50%{background-position:0% 0;}100%{background-position:100% 0;}}
@keyframes fadepulse{0%,100%{opacity:.4;}50%{opacity:1;}}

.sync-badge{display:inline-flex;align-items:center;gap:4px;font-family:'Zen Dots',cursive;font-size:8px;letter-spacing:.5px;padding:3px 8px;border-radius:20px;}

.sync-ok{background:#3BB27315;color:#3BB273;border:1px solid #3BB27330;}
.sync-err{background:#C84B3115;color:#C84B31;border:1px solid #C84B3130;}
.sync-saving{background:#F18F0115;color:#F18F01;border:1px solid #F18F0130;}
@keyframes loadfill{0%{width:0%;}50%{width:80%;}100%{width:100%;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.fu{animation:fadeUp .28s ease both;}

</style>

// ═══ PERSIST ═══
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  updateBadge("💾 儲存中…","#9A8F7E");
  saveTimer=setTimeout(async()=>{
    try{
      await dbSave({
        flights:S.flights,days:S.days,persons:S.persons,pexp:S.pexp,
        customSpots:S.customSpots||[],expenses:S.expenses,
        preset:S.preset,budget:S.budget,num_days:S.numDays,day_pass:S.dayPass
      });
      updateBadge("✓ 已儲存","#3BB273");
      setTimeout(()=>updateBadge("☁️ 雲端同步","#9A8F7E"),2500);
    }catch(e){updateBadge("✗ 失敗","#C84B31");}
  },800);
}
function updateBadge(text,color){
  const b=document.querySelector(".sync-badge");
  if(b){b.textContent=text;b.style.color=color;}
}

function render(){
  const app=document.getElementById("app");
  while(app.firstChild)app.removeChild(app.firstChild);
  app.appendChild(buildHeader());
  app.appendChild(buildMain());
}

function buildHeader(){
  const hdr=document.createElement("div");
  hdr.className="header";
  hdr.innerHTML=`

  const tabBar=document.createElement("div");
  tabBar.className="tab-bar";
  [{"k":"flight","l":"✈️ 航班"},{"k":"plan","l":"📅 行程"},{"k":"expense","l":"💳 記帳"},{"k":"budget","l":"💰 預算"},{"k":"nav","l":"🗺 導航"}].forEach(({"k":k,"l":l})=>{

    btn.onclick=()=>{S.tab=k;render();};

function buildMain(){
  const main=document.createElement("div");
  main.className="main";
  const content=document.createElement("div");
  content.className="content";
  if(S.tab==="flight")      buildFlightTab(content);
  else if(S.tab==="plan")   buildPlanTab(content);
  else if(S.tab==="expense")buildExpenseTab(content);
  else if(S.tab==="budget") buildBudgetTab(content);
  else if(S.tab==="nav")    buildNavTab(content);
  main.appendChild(content);
  return main;
}

      <div style="flex:1"><label class="flabel">目的地</label><input class="inp" id="ff-to" placeholder="NRT" value="${f.to||'NRT'}"></div>
    </div>
    <div style="margin-bottom:10px"><label class="flabel">日期</label><input class="inp" id="ff-date" type="date" value="${f.date||''}"></div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div style="flex:1"><label class="flabel">起飛</label><input class="inp" id="ff-dep" type="time" value="${f.departTime||''}"></div>
      <div style="flex:1"><label class="flabel">抵達</label><input class="inp" id="ff-arr" type="time" value="${f.arriveTime||''}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div style="flex:1"><label class="flabel">航廈</label>
        <select class="inp" id="ff-term">
          <option value="">–</option>
          <option value="1" ${f.terminal==='1'?'selected':''}>第1航廈</option>
          <option value="2" ${f.terminal==='2'?'selected':''}>第2航廈</option>
          <option value="3" ${f.terminal==='3'?'selected':''}>第3航廈</option>
        </select>
      </div>
      <div style="flex:1"><label class="flabel">登機門</label><input class="inp" id="ff-gate" placeholder="A12" value="${f.gate||''}"></div>
      <div style="flex:1"><label class="flabel">座位</label><input class="inp" id="ff-seat" placeholder="24A" value="${f.seat||''}"></div>
    </div>
    <div style="margin-bottom:14px"><label class="flabel">機票金額 NT$（每人）</label><input class="inp" id="ff-price" type="number" placeholder="11000" value="${f.ticketPrice||''}"></div>
    <div style="display:flex;gap:8px">
      <button id="ff-cancel" class="btn-sm" style="flex:1;padding:12px">取消</button>
      <button id="ff-save" class="btn-red" style="flex:2;padding:12px">${S.editFlight?"儲存修改":"確認新增"}</button>
    </div>`;

  card.querySelector("#ff-dep").onclick=()=>{
    S.flightForm.direction="去程";
    card.querySelector("#ff-from").value="TPE";
    card.querySelector("#ff-to").value="NRT";
    card.querySelector("#ff-dep").style.background="#1A1008";card.querySelector("#ff-dep").style.color="#F5F0E8";
    card.querySelector("#ff-ret").style.background="#FDFAF5";card.querySelector("#ff-ret").style.color="#6B5D4A";
  };
  card.querySelector("#ff-ret").onclick=()=>{
    S.flightForm.direction="回程";
    card.querySelector("#ff-from").value="NRT";
    card.querySelector("#ff-to").value="TPE";
    card.querySelector("#ff-dep").style.background="#FDFAF5";card.querySelector("#ff-dep").style.color="#6B5D4A";
    card.querySelector("#ff-ret").style.background="#1A1008";card.querySelector("#ff-ret").style.color="#F5F0E8";
  };
  card.querySelector("#ff-cancel").onclick=()=>{S.showFlightForm=false;S.editFlight=null;render();};
  card.querySelector("#ff-save").onclick=()=>{
    S.flightForm.flightNo   =card.querySelector("#ff-no").value;
    S.flightForm.airline    =card.querySelector("#ff-airline").value;
    S.flightForm.from       =card.querySelector("#ff-from").value;
    S.flightForm.to         =card.querySelector("#ff-to").value;
    S.flightForm.date       =card.querySelector("#ff-date").value;
    S.flightForm.departTime =card.querySelector("#ff-dep").value;
    S.flightForm.arriveTime =card.querySelector("#ff-arr").value;
    S.flightForm.terminal   =card.querySelector("#ff-term").value;
    S.flightForm.gate       =card.querySelector("#ff-gate").value;
    S.flightForm.seat       =card.querySelector("#ff-seat").value;
    S.flightForm.ticketPrice=card.querySelector("#ff-price").value;
    if(!S.flightForm.flightNo&&!S.flightForm.date)return;
    if(S.editFlight)S.flights=S.flights.map(x=>x.id===S.editFlight?{...S.flightForm,id:S.editFlight}:x);
    else S.flights=[...S.flights,{...S.flightForm,id:Date.now()}];
    S.showFlightForm=false;S.editFlight=null;persist();render();
  };
  return card;
}

// ═══ EXPENSE TAB ═══
function buildExpenseTab(el){
  // Add button
  if(!S.showExpForm){
    const addBtn=document.createElement("button");
    addBtn.className="btn-red";
    addBtn.style.cssText="width:100%;margin-bottom:14px";
    addBtn.textContent="＋ 新增消費記錄";
    addBtn.onclick=()=>{
      S.expForm={label:"",category:"🍜 餐飲",amount:"",currency:"TWD",paidBy:S.persons[0]?.id||1,splitWith:[],date:"",note:""};
      S.showExpForm=true;render();
    };
    el.appendChild(addBtn);
  }

  // Inline expense form
  if(S.showExpForm){
    const card=document.createElement("div");
    card.className="card";
    card.style.marginBottom="14px";
    const f=S.expForm;
    const catOpts=EXP_CATS.map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('');
    const personOpts=S.persons.map(p=>`<option value="${p.id}" ${f.paidBy==p.id?'selected':''}>${p.name}</option>`).join('');
    card.innerHTML=`
      <div style="font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;margin-bottom:14px">🧾 新增消費</div>
      <div style="margin-bottom:10px"><label class="flabel">消費名稱</label><input class="inp" id="ef-label" placeholder="例：一蘭拉麵" value="${f.label||''}"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div style="flex:1.2"><label class="flabel">分類</label><select class="inp" id="ef-cat">${catOpts}</select></div>
        <div style="flex:1"><label class="flabel">日期</label><input class="inp" id="ef-date" type="date" value="${f.date||''}"></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div style="flex:1.5"><label class="flabel">金額</label><input class="inp" id="ef-amount" type="number" placeholder="0" value="${f.amount||''}"></div>
        <div style="flex:1"><label class="flabel">幣別</label>
          <select class="inp" id="ef-cur">
            <option value="TWD" ${f.currency==='TWD'?'selected':''}>🇹🇼 TWD</option>
            <option value="JPY" ${f.currency==='JPY'?'selected':''}>🇯🇵 JPY</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:10px"><label class="flabel">由誰付款</label><select class="inp" id="ef-payer">${personOpts}</select></div>
      <div style="margin-bottom:14px"><label class="flabel">備註</label><input class="inp" id="ef-note" placeholder="例：含服務費" value="${f.note||''}"></div>
      <div style="display:flex;gap:8px">
        <button id="ef-cancel" class="btn-sm" style="flex:1;padding:12px">取消</button>
        <button id="ef-save" class="btn-red" style="flex:2;padding:12px">確認記帳</button>
      </div>`;
    card.querySelector("#ef-cancel").onclick=()=>{S.showExpForm=false;render();};
    card.querySelector("#ef-save").onclick=()=>{
      S.expForm.label   =card.querySelector("#ef-label").value;
      S.expForm.category=card.querySelector("#ef-cat").value;
      S.expForm.date    =card.querySelector("#ef-date").value;
      S.expForm.amount  =card.querySelector("#ef-amount").value;
      S.expForm.currency=card.querySelector("#ef-cur").value;
      S.expForm.paidBy  =Number(card.querySelector("#ef-payer").value);
      S.expForm.note    =card.querySelector("#ef-note").value;
      if(!S.expForm.label||!S.expForm.amount)return;
      S.expenses=[...S.expenses,{...S.expForm,id:Date.now()}];
      S.showExpForm=false;persist();render();
    };
    el.appendChild(card);
  }

  // Expense list
  if(S.expenses.length===0){
    const empty=document.createElement("div");
    empty.className="card";
    empty.style.cssText="text-align:center;padding:26px 16px";
    empty.innerHTML=`<div style="font-size:40px;margin-bottom:8px">🧾</div><div style="font-size:14px;font-weight:700;margin-bottom:4px">尚未有消費記錄</div><div style="font-size:11px;color:#9A8F7E">記錄每筆消費，自動計算分攤</div>`;
    el.appendChild(empty);
  } else {
    // Summary
    const total=S.expenses.reduce((a,e)=>a+(e.currency==="JPY"?j2t(Number(e.amount)):Number(e.amount)),0);
    const summary=document.createElement("div");
    summary.className="card";
    summary.style.cssText="background:linear-gradient(135deg,#1A1008,#2D1F0A);border:none;margin-bottom:12px;padding:14px 16px";
    summary.innerHTML=`<div style="font-size:9px;color:#8B7355;letter-spacing:2px;font-family:'Zen Dots',cursive;margin-bottom:4px">TOTAL EXPENSE</div><div style="font-family:'Zen Dots',cursive;font-size:22px;color:#F5F0E8">NT$${total.toLocaleString()}</div><div style="font-size:10px;color:#8B7355;margin-top:2px">${S.expenses.length} 筆消費</div>`;
    el.appendChild(summary);

    S.expenses.slice().reverse().forEach(e=>{
      const row=document.createElement("div");
      row.className="card";
      row.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:11px 13px";
      const amt=e.currency==="JPY"?j2t(Number(e.amount)):Number(e.amount);
      row.innerHTML=`
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.label}</div>
          <div style="font-size:10px;color:#9A8F7E;margin-top:1px">${e.category} · ${e.date||"–"} · ${S.persons.find(p=>p.id===e.paidBy)?.name||"?"}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-family:'Zen Dots',cursive;font-size:13px;color:#C84B31">NT$${amt.toLocaleString()}</div>
          ${e.currency==="JPY"?`<div style="font-size:9px;color:#9A8F7E">${fmtY(e.amount)}</div>`:''}</div>
        <button class="erow-del">✕</button>`;
      row.querySelector(".erow-del").onclick=()=>{S.expenses=S.expenses.filter(x=>x.id!==e.id);persist();render();};
      el.appendChild(row);
    });
  }
}

// ═══ PLAN TAB ═══
function buildPlanTab(el){
  // Sub tabs
  const subNav=document.createElement("div");
  subNav.style.cssText="display:flex;gap:7px;margin-bottom:13px";
  [{"k":"lib","l":"🗾 景點庫"},{"k":"days","l":"📅 我的行程"}].forEach(({"k":k,"l":l})=>{
    const btn=document.createElement("button");
    btn.className="btn-sm"+(S.subTab===k?" active":"");
    btn.style.cssText="flex:1;padding:9px;font-size:12px";
    btn.textContent=l;
    btn.onclick=()=>{S.subTab=k;render();};
    subNav.appendChild(btn);
  });
  el.appendChild(subNav);

  if(S.subTab==="lib"){
    // Day selector
    const dayWrap=document.createElement("div");
    dayWrap.style.marginBottom="10px";
    const dayLabel=document.createElement("div");
    dayLabel.style.cssText="font-size:11px;color:#9A8F7E;font-weight:600;margin-bottom:6px";
    dayLabel.textContent="加入到 →";
    dayWrap.appendChild(dayLabel);
    const strip=document.createElement("div");
    strip.className="day-strip";
    DAYS5.slice(0,S.numDays).forEach(d=>{
      const chip=document.createElement("span");
      chip.className="day-chip"+(S.selDay===d?" sel":"");
      chip.textContent=d;
      chip.onclick=()=>{S.selDay=d;render();};
      strip.appendChild(chip);
    });
    dayWrap.appendChild(strip);
    el.appendChild(dayWrap);

    // Filter pills
    const allSpots=[...SPOTS,...(S.customSpots||[])];
    const types=TYPE_ORDER.filter(t=>t==="全部"||allSpots.some(s=>s.type===t));
    const pills=document.createElement("div");
    pills.className="pills";
    pills.style.marginBottom="10px";
    types.forEach(t=>{
      const p=document.createElement("span");
      p.className="pill"+(S.filter===t?" on":"");
      p.textContent=t;
      p.onclick=()=>{S.filter=t;render();};
      pills.appendChild(p);
    });
    el.appendChild(pills);

    // Add custom button
    const addRow=document.createElement("div");
    addRow.style.cssText="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px";
    const countEl=document.createElement("div");
    countEl.style.cssText="font-size:11px;color:#B0A090";
    const filtered=allSpots.filter(s=>S.filter==="全部"||s.type===S.filter);
    countEl.textContent=filtered.length+" 個景點";
    addRow.appendChild(countEl);
    const customBtn=document.createElement("button");
    customBtn.className="btn-sm";
    customBtn.style.cssText="background:#1A1008;color:#F5F0E8;border:none;font-size:11px;padding:5px 12px";
    customBtn.textContent="＋ 自訂";
    customBtn.onclick=()=>{S.showAddSpot=true;render();};
    addRow.appendChild(customBtn);
    el.appendChild(addRow);

    // Custom spot form
    if(S.showAddSpot){
      el.appendChild(buildAddSpotForm());
    }

    // Spot cards
    const addedIds=new Set(DAYS5.flatMap(d=>S.days[d]||[]).map(s=>s.id));
    filtered.forEach(s=>{
      const added=addedIds.has(s.id);
      const card=document.createElement("div");
      card.className="scard"+(added?" added":"");
      card.style.position="relative";
      card.innerHTML=`
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div class="sico" style="width:40px;height:40px;font-size:18px;flex-shrink:0">${s.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>
            <div style="font-size:10px;color:#9A8F7E;margin-top:2px">${s.area}</div>
            <div style="font-size:10px;color:#C84B31;margin-top:2px">🚇 ${s.subway}</div>
            <div style="display:flex;gap:8px;margin-top:4px">
              <span style="font-size:9px;color:#9A8F7E">${s.cost===0?"免費":fmtY(s.cost)}</span>
              <span style="font-size:9px;color:#9A8F7E">${s.dur}分鐘</span>
            </div>
          </div>
        </div>
        ${s.hot&&!added?'<div class="hot-badge">🔥 HOT</div>':''}
        ${s.custom&&!added?'<div class="hot-badge" style="background:#8B5CF6">✏️ 自訂</div>':''}
        ${added?'<div class="hot-badge" style="background:#3BB273">✓ 已加入</div>':''}`;
      if(!added){
        card.onclick=()=>{
          S.days={...S.days,[S.selDay]:[...(S.days[S.selDay]||[]),s]};
          persist();render();
        };
      } else {
        card.onclick=()=>{S.mSpot=s;render();};
      }
      if(s.custom&&!added){
        const delBtn=document.createElement("button");
        delBtn.style.cssText="position:absolute;bottom:9px;right:9px;background:#FFF0EE;border:1px solid #F0D0C8;border-radius:5px;color:#C84B31;font-size:9px;padding:2px 6px;cursor:pointer";
        delBtn.textContent="刪除";
        delBtn.onclick=e=>{e.stopPropagation();S.customSpots=S.customSpots.filter(x=>x.id!==s.id);persist();render();};
        card.appendChild(delBtn);
      }
      el.appendChild(card);
    });

    // Spot detail card
    if(S.mSpot){
      const s=S.mSpot;
      const overlay=document.createElement("div");
      overlay.className="ov";
      overlay.onclick=e=>{if(e.target===overlay){S.mSpot=null;render();}};
      const modal=document.createElement("div");
      modal.className="modal";
      modal.onclick=e=>e.stopPropagation();
      modal.innerHTML=`
        <div class="modal-bar"></div>
        <div style="text-align:center;margin-bottom:13px">
          <div style="font-size:44px;margin-bottom:6px">${s.icon}</div>
          <div style="font-size:18px;font-weight:700;margin-bottom:3px">${s.name}</div>
          <div style="font-size:12px;color:#9A8F7E">${s.area} · ${s.type}</div>
        </div>
        <div class="tip" style="margin-bottom:12px;font-size:12px">${s.tip}</div>
        <div style="background:#F0EBE0;border-radius:10px;padding:10px 13px;margin-bottom:12px">
          <div style="font-size:9px;font-weight:700;color:#C84B31;margin-bottom:3px;letter-spacing:1px">TRANSIT</div>
          <div style="font-size:12px">🚇 ${s.subway}</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <div style="flex:1;background:#F0EBE0;border-radius:10px;padding:10px;text-align:center">
            <div style="font-size:10px;color:#9A8F7E;margin-bottom:3px">費用</div>
            <div style="font-size:15px;color:#3BB273;font-weight:700">${s.cost===0?"免費":fmtY(s.cost)}</div>
          </div>
          <div style="flex:1;background:#F0EBE0;border-radius:10px;padding:10px;text-align:center">
            <div style="font-size:10px;color:#9A8F7E;margin-bottom:3px">時間</div>
            <div style="font-size:15px;color:#2E86AB;font-weight:700">${s.dur}分鐘</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:9px">
          <a href="${gmapSearch(s)}" target="_blank" class="nbtn g" style="flex:1;padding:10px;text-align:center;text-decoration:none">📍 Google Maps</a>
          <a href="${gmapNav(s)}" target="_blank" class="nbtn b" style="flex:1;padding:10px;text-align:center;text-decoration:none">🚇 地鐵導航</a>
        </div>`;
      const removeBtn=document.createElement("button");
      removeBtn.style.cssText="width:100%;padding:10px;font-size:13px;border-radius:8px;border:1px solid #F0D0C8;background:#FFF0EE;color:#C84B31;cursor:pointer";
      removeBtn.textContent="從行程中移除";
      removeBtn.onclick=()=>{DAYS5.forEach(d=>{S.days={...S.days,[d]:(S.days[d]||[]).filter(x=>x.id!==s.id)};});S.mSpot=null;persist();render();};
      modal.appendChild(removeBtn);
      overlay.appendChild(modal);
      el.appendChild(overlay);
    }
  } else {
    // Days view
    buildDaysView(el);
  }
}

function buildDaysView(el){
  // Num days + day pass
  const settings=document.createElement("div");
  settings.className="card";
  settings.style.marginBottom="12px";
  const daysRow=document.createElement("div");
  daysRow.style.cssText="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px";
  daysRow.innerHTML=`<span style="font-size:13px;font-weight:600">旅遊天數</span>`;
  const daysBtn=document.createElement("div");
  daysBtn.style.cssText="display:flex;gap:5px";
  [3,4,5].forEach(n=>{
    const b=document.createElement("button");
    b.className="btn-sm"+(S.numDays===n?" active":"");
    b.textContent=n+"天";
    b.onclick=()=>{S.numDays=n;const nd={};DAYS5.slice(0,n).forEach(k=>{nd[k]=S.days[k]||[];});S.days=nd;persist();render();};
    daysBtn.appendChild(b);
  });
  daysRow.appendChild(daysBtn);
  settings.appendChild(daysRow);
  el.appendChild(settings);

  DAYS5.slice(0,S.numDays).forEach(day=>{
    const spots=S.days[day]||[];
    const sec=document.createElement("div");
    sec.className="sec";
    sec.style.display="flex";
    sec.style.justifyContent="space-between";
    sec.innerHTML=`<span>${day}</span><span style="font-size:10px;color:#9A8F7E;font-weight:400">${spots.length} 景點</span>`;
    el.appendChild(sec);
    if(spots.length===0){
      const empty=document.createElement("div");
      empty.className="card";
      empty.style.cssText="text-align:center;padding:16px;color:#C0B8A8;font-size:12px";
      empty.textContent="點景點庫加入景點";
      el.appendChild(empty);
    } else {
      spots.forEach((s,i)=>{
        const row=document.createElement("div");
        row.className="card";
        row.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:10px 12px";
        row.innerHTML=`
          <div style="width:22px;height:22px;border-radius:50%;background:#C84B31;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-family:'Zen Dots',cursive;flex-shrink:0">${i+1}</div>
          <div style="font-size:20px;flex-shrink:0">${s.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>
            <div style="font-size:9px;color:#C84B31">${s.subway}</div>
          </div>`;
        const delBtn=document.createElement("button");
        delBtn.className="btn-danger";
        delBtn.textContent="✕";
        delBtn.onclick=()=>{S.days={...S.days,[day]:S.days[day].filter(x=>x.id!==s.id)};persist();render();};
        row.appendChild(delBtn);
        el.appendChild(row);
      });
    }
  });
}

function buildAddSpotForm(){
  const f=S.addSpotForm;
  const card=document.createElement("div");
  card.className="card";
  card.style.marginBottom="12px";
  const ICONS=["📍","🍜","🍣","🍺","🍵","☕","🛍️","🎮","🎎","⛩️","🌸","🏖️","🎡","🚗","🏨","🎵","🎨","🌿"];
  const allTypes=TYPE_ORDER.filter(t=>t!=="全部");
  const typeButtons=allTypes.map(t=>`<span class="addspot-type" data-type="${t}" style="display:inline-block;padding:5px 10px;border-radius:16px;font-size:10px;font-weight:600;cursor:pointer;margin:2px;background:${f.type===t?'#1A1008':'#F0EBE0'};color:${f.type===t?'#F5F0E8':'#6B5D4A'};border:1px solid ${f.type===t?'#1A1008':'#E0D5C0'}">${t}</span>`).join('')+`<span class="addspot-type" data-type="__new__" style="display:inline-block;padding:5px 10px;border-radius:16px;font-size:10px;font-weight:600;cursor:pointer;margin:2px;background:#F0EBE0;color:#6B5D4A;border:1px solid #E0D5C0">＋ 新增</span>`;
  const iconButtons=ICONS.map(ic=>`<span class="addspot-icon" data-icon="${ic}" style="font-size:20px;cursor:pointer;padding:3px;border-radius:6px;background:${f.icon===ic?'#F0EBE0':'transparent'};border:1px solid ${f.icon===ic?'#C84B31':'transparent'}">${ic}</span>`).join('');
  card.innerHTML=`
    <div style="font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;margin-bottom:14px">✏️ 自訂新增景點</div>
    <div style="margin-bottom:10px"><label class="flabel">景點名稱 *</label><input class="inp" id="as-name" placeholder="例：吉卜力美術館" value="${f.name||''}"></div>
    <div style="margin-bottom:10px"><label class="flabel">區域</label><input class="inp" id="as-area" placeholder="例：三鷹 / 新宿" value="${f.area||''}"></div>
    <div style="margin-bottom:10px"><label class="flabel">分類</label><div style="margin-bottom:6px">${typeButtons}</div><input class="inp" id="as-ctype" placeholder="輸入新分類" value="${f.customType||''}" style="display:${f.type===''?'block':'none'}"></div>
    <div style="margin-bottom:10px"><label class="flabel">圖示</label><div style="display:flex;flex-wrap:wrap;gap:4px">${iconButtons}</div></div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div style="flex:1"><label class="flabel">費用(¥)</label><input class="inp" id="as-cost" type="number" placeholder="0=免費" value="${f.cost||''}"></div>
      <div style="flex:1"><label class="flabel">時間(分)</label><input class="inp" id="as-dur" type="number" placeholder="90" value="${f.dur||'90'}"></div>
    </div>
    <div style="margin-bottom:10px"><label class="flabel">最近地鐵站</label><input class="inp" id="as-subway" placeholder="例：JR 三鷹站 徒步10分" value="${f.subway||''}"></div>
    <div style="margin-bottom:14px"><label class="flabel">備註</label><input class="inp" id="as-tip" placeholder="例：需提前預約" value="${f.tip||''}"></div>
    <div style="font-size:10px;color:#9A8F7E;background:#F0EBE0;border-radius:8px;padding:8px;margin-bottom:12px">📍 系統自動搜尋 Google Maps 座標</div>
    <div style="display:flex;gap:8px">
      <button id="as-cancel" class="btn-sm" style="flex:1;padding:12px">取消</button>
      <button id="as-save" class="btn-red" style="flex:2;padding:12px">確認新增</button>
    </div>`;
  card.querySelectorAll(".addspot-type").forEach(btn=>{
    btn.onclick=()=>{
      S.addSpotForm.type=btn.dataset.type==="__new__"?"":btn.dataset.type;
      S.addSpotForm.customType="";
      // Update button styles without render()
      card.querySelectorAll(".addspot-type").forEach(b=>{
        b.style.background=b===btn&&btn.dataset.type!=="__new__"?"#1A1008":"#F0EBE0";
        b.style.color=b===btn&&btn.dataset.type!=="__new__"?"#F5F0E8":"#6B5D4A";
        b.style.borderColor=b===btn&&btn.dataset.type!=="__new__"?"#1A1008":"#E0D5C0";
      });
      const ctypeInp=card.querySelector("#as-ctype");
      if(ctypeInp)ctypeInp.style.display=btn.dataset.type==="__new__"?"block":"none";
    };
  });
  card.querySelectorAll(".addspot-icon").forEach(btn=>{
    btn.onclick=()=>{
      S.addSpotForm.icon=btn.dataset.icon;
      card.querySelectorAll(".addspot-icon").forEach(b=>{
        b.style.background=b===btn?"#F0EBE0":"transparent";
        b.style.borderColor=b===btn?"#C84B31":"transparent";
      });
    };
  });
  card.querySelector("#as-cancel").onclick=()=>{S.showAddSpot=false;render();};
  card.querySelector("#as-save").onclick=async()=>{
    S.addSpotForm.name  =card.querySelector("#as-name").value.trim();
    S.addSpotForm.area  =card.querySelector("#as-area").value.trim();
    S.addSpotForm.ctype =card.querySelector("#as-ctype").value.trim();
    S.addSpotForm.cost  =card.querySelector("#as-cost").value;
    S.addSpotForm.dur   =card.querySelector("#as-dur").value;
    S.addSpotForm.subway=card.querySelector("#as-subway").value.trim();
    S.addSpotForm.tip   =card.querySelector("#as-tip").value.trim();
    if(!S.addSpotForm.name)return;
    const type=S.addSpotForm.customType||S.addSpotForm.ctype||S.addSpotForm.type||"📍 自訂景點";
    if(!TYPE_ORDER.includes(type))TYPE_ORDER.push(type);
    let lat=35.6762,lng=139.6503;
    try{
      const q=encodeURIComponent(S.addSpotForm.name+" "+(S.addSpotForm.area||"")+" 東京 日本");
      const tout=new Promise((_,r)=>setTimeout(()=>r("t"),3000));
      const res=await Promise.race([fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`).then(r=>r.json()),tout]);
      if(res&&res[0]){lat=parseFloat(res[0].lat);lng=parseFloat(res[0].lon);}
    }catch(_){}
    const spot={id:Date.now(),name:S.addSpotForm.name,area:S.addSpotForm.area||"東京",type,cost:Number(S.addSpotForm.cost)||0,dur:Number(S.addSpotForm.dur)||90,icon:S.addSpotForm.icon||"📍",ig:"自訂",hot:false,subway:S.addSpotForm.subway||"請查詢最近車站",lat,lng,tip:S.addSpotForm.tip||S.addSpotForm.name,custom:true};
    S.customSpots=[...S.customSpots,spot];
    S.addSpotForm={name:"",area:"",type:"",customType:"",ctype:"",cost:"",dur:"90",icon:"📍",tip:"",subway:""};
    S.showAddSpot=false;persist();render();
  };
  return card;
}

// ═══ BUDGET TAB ═══
function buildBudgetTab(el){
  // Preset cards
  const secEl=document.createElement("div");secEl.className="sec";secEl.textContent="2026 預算等級";el.appendChild(secEl);
  Object.entries(BP_DEF).forEach(([key,p])=>{
    const card=document.createElement("div");
    card.className="bcard"+(S.preset===key?" sel":"");
    card.onclick=()=>{S.preset=key;S.budget={...p};persist();render();};
    const total=p.flight+p.hotel*S.numDays+p.food*3*S.numDays+p.misc;
    card.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:28px">${p.icon}</div>
          <div><div style="font-size:13px;font-weight:700">${p.label}</div><div style="font-size:11px;color:#9A8F7E">每人約 NT$${total.toLocaleString()}</div></div>
        </div>
        <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${S.preset===key?"#C84B31":"#E0D5C0"};background:${S.preset===key?"#C84B31":"transparent"};display:flex;align-items:center;justify-content:center">
          ${S.preset===key?'<div style="width:8px;height:8px;border-radius:50%;background:#fff"></div>':''}
        </div>
      </div>
      ${S.preset===key?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">${[["✈️",p.flight],["🏨",p.hotel],["🍜",p.food],["🛍️",p.misc]].map(([ic,v])=>`<span class="cpill">${ic} NT$${v.toLocaleString()}</span>`).join('')}</div>`:''}`;
    el.appendChild(card);
  });

  // Custom inputs
  const sec2=document.createElement("div");sec2.className="sec";sec2.textContent="自訂每人預算";el.appendChild(sec2);
  const inputCard=document.createElement("div");inputCard.className="card";
  [{"key":"flight","label":"✈️ 來回機票"},{"key":"hotel","label":"🏨 住宿/每晚"},{"key":"food","label":"🍜 餐費/每餐"},{"key":"misc","label":"🛍️ 購物&其他"}].forEach(({"key":key,"label":label})=>{
    const row=document.createElement("div");
    row.style.cssText="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDE6D8";
    const lbl=document.createElement("div");lbl.style.cssText="font-size:12px;font-weight:600";lbl.textContent=label;
    const right=document.createElement("div");right.style.cssText="display:flex;align-items:center;gap:4px";
    const prefix=document.createElement("div");prefix.style.cssText="font-size:11px;color:#9A8F7E";prefix.textContent="NT$";
    const inp=document.createElement("input");
    inp.type="number";inp.className="inp";
    inp.style.cssText="width:110px;text-align:right;padding:6px 8px;font-size:13px;font-family:'Zen Dots',cursive;color:#C84B31;border:1px solid #E0D5C0;border-radius:8px";
    inp.value=S.budget[key]||0;
    inp.onblur=()=>{S.budget[key]=Number(inp.value)||0;persist();render();};
    right.appendChild(prefix);right.appendChild(inp);
    row.appendChild(lbl);row.appendChild(right);
    inputCard.appendChild(row);
  });
  el.appendChild(inputCard);

  // Summary
  const allAdded=DAYS5.flatMap(d=>S.days[d]||[]);
  const spotJPY=allAdded.reduce((a,x)=>a+x.cost,0);
  const transTWD=j2t(S.dayPass?S.numDays*800*S.persons.length:allAdded.length*220*S.persons.length);
  const bpp=S.budget.flight+S.budget.hotel*S.numDays+S.budget.food*3*S.numDays+S.budget.misc;
  const grand=bpp*S.persons.length;
  const sec3=document.createElement("div");sec3.className="sec";sec3.textContent="每人費用試算";el.appendChild(sec3);
  const dark=document.createElement("div");
  dark.className="card";
  dark.style.cssText="background:linear-gradient(135deg,#1A1008,#2D1F0A);border:none;padding:18px 16px";
  dark.innerHTML=`
    <div style="font-size:9px;color:#8B7355;letter-spacing:2px;font-family:'Zen Dots',cursive;margin-bottom:4px">2026 TOKYO · PER PERSON</div>
    <div style="font-family:'Zen Dots',cursive;font-size:28px;color:#F5F0E8;margin-bottom:4px">NT$${bpp.toLocaleString()}</div>
    <div style="font-size:11px;color:#8B7355;margin-bottom:14px">${S.persons.length} 人合計 NT$${grand.toLocaleString()}</div>
    ${[["✈️ 機票",S.budget.flight,"#C84B31"],["🏨 住宿",S.budget.hotel*S.numDays,"#E8831A"],["🍜 餐飲",S.budget.food*3*S.numDays,"#F5A623"],["🗺 景點",j2t(spotJPY),"#4CAF50"],["🚇 交通",transTWD,"#2E86AB"],["🛍️ 購物等",S.budget.misc,"#9B59B6"]].map(([l,v,c])=>{
      const pct=bpp>0?Math.round(v/bpp*100):0;
      return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <div style="font-size:12px;color:#C8B89A;width:70px">${l}</div>
          <div style="flex:1;height:3px;background:#2D1F0A;border-radius:2px">
            <div style="width:${pct}%;height:100%;background:${c};border-radius:2px"></div>
          </div>
          <div style="font-size:9px;color:#8B7355;width:28px;text-align:right">${pct}%</div>
        </div>
        <div style="font-family:'Zen Dots',cursive;font-size:12px;color:${c};margin-left:10px;width:90px;text-align:right">NT$${v.toLocaleString()}</div>
      </div>`;
    }).join('')}`;
  el.appendChild(dark);

  // Persons
  const sec4=document.createElement("div");sec4.className="sec";sec4.textContent="旅伴設定";el.appendChild(sec4);
  const personCard=document.createElement("div");personCard.className="card";
  S.persons.forEach(p=>{
    const row=document.createElement("div");
    row.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:9px";
    row.appendChild(avatar(p.name,p.color));
    const name=document.createElement("span");name.style.cssText="flex:1;font-size:13px;font-weight:600";name.textContent=p.name;
    row.appendChild(name);
    if(S.persons.length>1){
      const del=document.createElement("button");del.className="btn-danger";del.textContent="移除";
      del.onclick=()=>{S.persons=S.persons.filter(x=>x.id!==p.id);persist();render();};
      row.appendChild(del);
    }
    personCard.appendChild(row);
  });
  const addRow=document.createElement("div");addRow.style.cssText="display:flex;gap:7px;margin-top:4px";
  const nameInp=document.createElement("input");
  nameInp.className="inp";nameInp.style.flex="1";nameInp.placeholder="新增旅伴姓名";
  nameInp.value=S.newName;
  nameInp.oninput=e=>{S.newName=e.target.value;};
  nameInp.onkeydown=e=>{if(e.key==="Enter"&&S.newName.trim())addPerson();};
  const addBtn2=document.createElement("button");addBtn2.className="btn-sm";addBtn2.style.padding="9px 12px";addBtn2.textContent="＋";
  addBtn2.onclick=addPerson;
  function addPerson(){if(!S.newName.trim())return;S.persons=[...S.persons,{id:Date.now(),name:S.newName.trim(),color:PC[S.persons.length%PC.length]}];S.newName="";persist();render();}
  addRow.appendChild(nameInp);addRow.appendChild(addBtn2);
  personCard.appendChild(addRow);
  el.appendChild(personCard);
}

// ═══ NAV TAB ═══
function buildNavTab(el){
  const subTabs=document.createElement("div");
  subTabs.style.cssText="display:flex;gap:6px;margin-bottom:14px";
  [{"k":"spots","l":"📍 景點導航"},{"k":"pass","l":"🎫 票券"}].forEach(({"k":k,"l":l})=>{
    const b=document.createElement("button");
    b.className="btn-sm"+(S.transitTab===k?" active":"");
    b.style.cssText="flex:1;padding:8px;font-size:11px";
    b.textContent=l;
    b.onclick=()=>{S.transitTab=k;render();};
    subTabs.appendChild(b);
  });
  el.appendChild(subTabs);

  if(S.transitTab==="pass"){
    PASS_RECOMMEND.forEach(p=>{
      const isSel=S.selectedPass===p.id;
      const card=document.createElement("div");
      card.style.cssText=`background:#FDFAF5;border:2px solid ${isSel?"#C84B31":"#E8DFD0"};border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer`;
      card.innerHTML=`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span style="font-size:22px">${p.icon}</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:700">${p.name}</div><div style="font-size:10px;color:#9A8F7E">${p.cover}</div></div>
          ${p.price>0?`<div style="font-family:'Zen Dots',cursive;font-size:14px;color:#C84B31">¥${p.price}</div>`:`<div style="font-size:11px;color:#059669;font-weight:700">按次計費</div>`}
        </div>
        <div style="background:#F0EBE0;border-radius:8px;padding:7px 10px">
          <div style="font-size:10px;color:#C84B31;font-weight:700;margin-bottom:2px">✅ ${p.best}</div>
          <div style="font-size:10px;color:#6B5D4A">💡 ${p.tip}</div>
        </div>
        ${isSel?'<div style="margin-top:6px;font-size:11px;color:#C84B31;font-weight:700">✓ 已選擇</div>':''}`;
      card.onclick=()=>{S.selectedPass=p.id;render();};
      el.appendChild(card);
    });
    return;
  }

  // Spots nav
  const allSpots=[...SPOTS,...(S.customSpots||[])];
  const navTypes=TYPE_ORDER.filter(t=>t==="全部"||allSpots.some(s=>s.type===t));
  const pills=document.createElement("div");pills.className="pills";pills.style.marginBottom="12px";
  navTypes.forEach(t=>{
    const p=document.createElement("span");p.className="pill"+(S.navFilter===t?" on":"");p.textContent=t;
    p.onclick=()=>{S.navFilter=t;render();};
    pills.appendChild(p);
  });
  el.appendChild(pills);
  const navFiltered=allSpots.filter(s=>S.navFilter==="全部"||s.type===S.navFilter);
  const count=document.createElement("div");count.style.cssText="font-size:11px;color:#B0A090;margin-bottom:8px";count.textContent=navFiltered.length+" 個景點";
  el.appendChild(count);
  navFiltered.forEach(s=>{
    const card=document.createElement("div");
    card.className="card";
    card.style.cssText="display:flex;align-items:center;gap:11px;margin-bottom:6px;padding:11px 13px";
    card.innerHTML=`
      <div class="sico" style="width:37px;height:37px;font-size:17px">${s.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>
        <div style="font-size:10px;color:#C84B31;font-weight:600;margin-top:2px">🚇 ${s.subway}</div>
      </div>
      <div style="display:flex;gap:5px">
        <a class="nbtn g" href="${gmapSearch(s)}" target="_blank">📍</a>
        <a class="nbtn b" href="${gmapNav(s)}" target="_blank">🚇</a>
      </div>`;
    el.appendChild(card);
  });
}

// ═══ INIT ═══
async function init(){
  const MIN=2800, start=Date.now();
  try{
    const timeout=new Promise((_,r)=>setTimeout(()=>r("t"),4000));
    const d=await Promise.race([dbLoad(),timeout]);
    if(d){
      if(d.flights?.length)   S.flights=d.flights;
      if(d.days)              S.days=d.days;
      if(d.persons?.length)   S.persons=d.persons;
      if(d.pexp)              S.pexp=d.pexp;
      if(d.expenses?.length)  S.expenses=d.expenses;
      if(d.preset)            S.preset=d.preset;
      if(d.budget)            S.budget=d.budget;
      if(d.num_days)          S.numDays=d.num_days;
      if(d.day_pass!=null)    S.dayPass=d.day_pass;
      if(d.customSpots?.length) S.customSpots=d.customSpots;
    }
  }catch(_){}
  const remain=MIN-(Date.now()-start);
  if(remain>0)await new Promise(r=>setTimeout(r,remain));
  const ls=document.getElementById("loadingScreen");
  ls.style.transition="opacity .6s";ls.style.opacity="0";
  await new Promise(r=>setTimeout(r,620));
  ls.style.display="none";
  const app=document.getElementById("app");
  app.style.display="flex";app.style.opacity="0";app.style.transition="opacity .4s";
  setTimeout(()=>{app.style.opacity="1";},30);
  render();
}

init();
</script>
</body>
</html>
