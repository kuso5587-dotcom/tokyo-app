<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Serif+JP:wght@300;400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{width:100%;height:100%;background:#F5F0E8;}
body{font-family:'DM Sans',sans-serif;color:#1A1008;-webkit-font-smoothing:antialiased;overflow:hidden;}
::-webkit-scrollbar{width:0;}
.app{width:100%;max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#F5F0E8;position:relative;}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");opacity:.6;}
/* header */
.hdr{background:#F5F0E8;border-bottom:1.5px solid #E0D5C5;padding:0 18px;padding-top:env(safe-area-inset-top,0px);position:relative;z-index:50;flex-shrink:0;}
.hdr-top{padding:12px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;}
.logo-en{font-family:'Zen Dots',cursive;font-size:17px;color:#1A1008;letter-spacing:.5px;line-height:1;}
.logo-en span{color:#C84B31;}
.logo-jp{font-family:'Noto Serif JP',serif;font-size:9px;color:#9A8F7E;letter-spacing:2px;margin-top:2px;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.days-badge{font-family:'Zen Dots',cursive;font-size:10px;color:#C84B31;background:#C84B3115;border:1px solid #C84B3135;border-radius:6px;padding:4px 9px;}
.save-lbl{font-family:'Zen Dots',cursive;font-size:8px;letter-spacing:.5px;}
.tabbar{display:flex;border-top:1.5px solid #E0D5C5;}
.tabbar button{flex:1;padding:8px 1px;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;color:#9A8F7E;cursor:pointer;border-top:2px solid transparent;margin-top:-1.5px;transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}
.tabbar button.on{color:#C84B31;border-top-color:#C84B31;}
/* content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));position:relative;z-index:1;}
.sec{display:flex;align-items:center;gap:10px;font-family:'Zen Dots',cursive;font-size:9px;color:#C84B31;letter-spacing:2px;margin:18px 0 10px;}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#C84B3130,transparent);}
/* cards */
.card{background:#FDFAF5;border:1px solid #E8DFD0;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.scard{background:#FDFAF5;border:1px solid #E8DFD0;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .12s,border-color .12s;-webkit-tap-highlight-color:transparent;}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#E8DFD0;transition:background .12s;}
.scard:active{transform:scale(.98);}
.scard.added{border-color:#3BB27340;background:#F5FEFA;}
.scard.added::before{background:#3BB273;}
.scard:not(.added):active::before{background:#C84B31;}
.hot-badge{position:absolute;top:9px;right:9px;background:#C84B31;color:#fff;font-family:'Zen Dots',cursive;font-size:8px;padding:2px 7px;border-radius:4px;}
.sico{width:42px;height:42px;border-radius:12px;background:#F0EBE0;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:1px solid #E0D5C0;}
.tip{background:#F0EBE0;border-radius:8px;padding:7px 10px;font-size:11px;color:#6B5D4A;margin-top:8px;line-height:1.6;border-left:2.5px solid #C84B31;}
.sw{font-size:10px;color:#8B7355;margin-top:5px;font-weight:500;}
/* buttons */
.btn-red{display:inline-flex;align-items:center;justify-content:center;background:#C84B31;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;box-shadow:0 3px 12px #C84B3140;-webkit-tap-highlight-color:transparent;transition:filter .1s;}

.btn-sm{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;font-size:11px;background:#F0EBE0;color:#6B5D4A;border-radius:6px;border:1px solid #E0D5C0;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}

.btn-danger{background:#FFF0EE;color:#C84B31;border:1px solid #F0D0C8;padding:5px 10px;font-size:11px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent;}

.inp:focus{border-color:#C84B31;}
.inp::placeholder{color:#B0A090;}
select.inp{cursor:pointer;background-image:none;}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.pills::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #E0D5C0;color:#6B5D4A;background:#FDFAF5;white-space:nowrap;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.pill.on{background:#C84B31;color:#fff;border-color:#C84B31;}
.day-strip{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.day-strip::-webkit-scrollbar{display:none;}
.day-chip{flex-shrink:0;padding:6px 13px;border-radius:8px;font-family:'Zen Dots',cursive;font-size:10px;cursor:pointer;border:1.5px solid #E0D5C0;color:#9A8F7E;background:#FDFAF5;-webkit-tap-highlight-color:transparent;}
.day-chip.sel{background:#1A1008;color:#F5F0E8;border-color:#1A1008;}
.tog{width:46px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);-webkit-tap-highlight-color:transparent;}
.tok{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.pbar-track{height:6px;background:#EDE6D8;border-radius:3px;margin-top:5px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.bp{background:#FDFAF5;border-radius:16px;overflow:hidden;margin-bottom:12px;}
.bp-dashed{margin:12px 0;border-top:1.5px dashed #E0D5C5;position:relative;}
.bp-dashed::before{content:'';position:absolute;top:-8px;left:-1px;width:16px;height:16px;border-radius:50%;background:#F5F0E8;border:1.5px solid #E0D5C5;}
.bp-dashed::after{content:'';position:absolute;top:-8px;right:-1px;width:16px;height:16px;border-radius:50%;background:#F5F0E8;border:1.5px solid #E0D5C5;}
.ov{position:fixed;inset:0;background:rgba(26,16,8,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.modal{background:#F5F0E8;border-radius:24px 24px 0 0;padding:22px 18px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}

.loading-screen{position:fixed;inset:0;background:#F5F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}

.loading-sub{font-family:'Noto Serif JP',serif;font-size:11px;color:#C84B31;letter-spacing:1px;opacity:.7;margin-top:-8px;animation:fadepulse 2.5s ease-in-out infinite;}
@keyframes loadfill{0%{background-position:100% 0;}50%{background-position:0% 0;}100%{background-position:100% 0;}}
@keyframes fadepulse{0%,100%{opacity:.4;}50%{opacity:1;}}

.sync-badge{display:inline-flex;align-items:center;gap:4px;font-family:'Zen Dots',cursive;font-size:8px;letter-spacing:.5px;padding:3px 8px;border-radius:20px;}

.sync-saving{background:#F18F0115;color:#F18F01;border:1px solid #F18F0130;}
@keyframes loadfill{0%{width:0%;}50%{width:80%;}100%{width:100%;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.fu{animation:fadeUp .28s ease both;}

function checkPassCoverage(spot, passId){
  if(passId === "suica") return {ok:true, note:"Suica刷卡"};
  const lines = PASS_COVERAGE[passId] || [];
  const subway = spot.subway || "";
  const matched = lines.some(l => subway.includes(l));
  // Special checks
  if(!matched){
    // Check if needs extra ticket
    if(subway.includes("ゆりかもめ") || subway.includes("百合海鷗")){
      return {ok:false, note:"需另購百合海鷗券¥820"};
    }
    if(subway.includes("東急") || subway.includes("小田急") || subway.includes("東武") || subway.includes("西武") || subway.includes("京王") || subway.includes("京急") || subway.includes("京成")){
      return {ok:false, note:"私鐵需Suica/另購票"};
    }
    if((passId==="metro24") && (subway.includes("都營") || subway.includes("三田線") || subway.includes("大江戶") || subway.includes("淺草線") || subway.includes("新宿線"))){
      return {ok:false, note:"都營線需另購都營券¥700"};
    }
    if((passId==="jr1day") && (subway.includes("Metro") || subway.includes("銀座線") || subway.includes("日比谷") || subway.includes("半藏門") || subway.includes("千代田") || subway.includes("南北") || subway.includes("副都心"))){
      return {ok:false, note:"地鐵線需另購Metro券¥800"};
    }
    return {ok:false, note:"需Suica按次付費"};

}

async function init(){
  const MIN_LOAD_MS = 2800;
  const startTime = Date.now();

  try {
    const timeout = new Promise((_,rej) => setTimeout(()=>rej(new Error("timeout")), 4000));
    const d = await Promise.race([dbLoad(), timeout]);
    if(d){
      if(d.flights?.length)   S.flights  = d.flights;
      if(d.days)              S.days     = d.days;
      if(d.persons?.length)   S.persons  = d.persons;
      if(d.pexp)              S.pexp     = d.pexp;
      if(d.expenses?.length)  S.expenses = d.expenses;
      if(d.preset)            S.preset   = d.preset;
      if(d.budget)            S.budget   = d.budget;
      if(d.num_days)          S.numDays  = d.num_days;
      if(d.day_pass!==null&&d.day_pass!==undefined) S.dayPass = d.day_pass;
    }
  } catch(_){ /* 離線或超時，用預設值 */ }

  // 確保 loading 畫面至少顯示 MIN_LOAD_MS 毫秒
  const elapsed = Date.now() - startTime;
  const remain  = MIN_LOAD_MS - elapsed;
  if(remain > 0) await new Promise(r => setTimeout(r, remain));

  // 淡出 loading 畫面
  const ls = document.getElementById("loadingScreen");
  ls.style.transition = "opacity .6s ease";
  ls.style.opacity = "0";
  await new Promise(r => setTimeout(r, 620));
  ls.style.display = "none";

  document.getElementById("app").style.display = "flex";
  document.getElementById("app").style.opacity = "0";
  document.getElementById("app").style.transition = "opacity .4s ease";
  setTimeout(()=>{ document.getElementById("app").style.opacity="1"; }, 30);

  S.syncStatus="cloud";
  render();
}

const TYPE_ORDER=["全部","🌆 熱門景點","⛩️ 文化古蹟","🌅 展望台","🎨 藝術體驗","🆕 新地標","🎢 主題樂園","🍣 必吃美食","🔍 隱藏美食","🛍️ 一般購物","🎎 公仔玩具","👜 精品包","⌚ 精品錶","🏮 私藏秘境"];

function derived(){
  const dayKeys=DAYS5.slice(0,S.numDays);
  const allAdded=dayKeys.flatMap(d=>S.days[d]||[]);
  const addedIds=new Set(allAdded.map(s=>s.id));
  const spotJPY=allAdded.reduce((a,x)=>a+x.cost,0);
  // Transit cost based on selected pass
  const passId = S.selectedPass || "suica";
  let transTWD;
  if(passId === "suica"){
    transTWD = j2t(allAdded.length * 220 * S.persons.length);
  } else if(passId === "metro24"){
    transTWD = 800 * S.numDays * S.persons.length; // Metro day pass in TWD (800JPY * 0.22 already in j2t)
    transTWD = j2t(800 * S.numDays) * S.persons.length;
  } else if(passId === "jr1day"){
    transTWD = j2t(800 * S.numDays) * S.persons.length;
  } else if(passId === "combo"){
    transTWD = j2t(1000 * S.numDays) * S.persons.length;
  } else if(passId === "yurikamome"){
    transTWD = j2t(820 * S.numDays) * S.persons.length;
  } else {
    transTWD = j2t(S.dayPass ? S.numDays*800*S.persons.length : allAdded.length*220*S.persons.length);
  }
  const flightTotal=S.flights.reduce((a,f)=>a+(Number(f.ticketPrice)||0)*S.persons.length,0);
  const expTWD=S.expenses.reduce((a,e)=>a+(e.currency==="JPY"?j2t(Number(e.amount)):Number(e.amount)),0);
  const bpp=S.budget.flight+S.budget.hotel*S.numDays+S.budget.food*3*S.numDays+S.budget.misc;
  const perPerson=S.persons.map(p=>{
    let t=0;
    allAdded.forEach(s=>{const a=S.pexp[s.id]||[];t+=(a.length===0?s.cost/S.persons.length:(a.includes(p.id)?s.cost/a.length:0))*0.22;});
    t+=j2t(S.dayPass?S.numDays*800:allAdded.length*220);
    S.flights.forEach(f=>{t+=Number(f.ticketPrice)||0;});
    S.expenses.forEach(e=>{const sw=e.splitWith.length?e.splitWith:S.persons.map(x=>x.id);if(sw.includes(p.id)){const a=e.currency==="JPY"?j2t(Number(e.amount)):Number(e.amount);t+=a/sw.length;}});
    return{...p,total:Math.round(t)};
  });
  const grand=perPerson.reduce((a,p)=>a+p.total,0);
  const TYPES=TYPE_ORDER.filter(t=>t==="全部"||SPOTS.some(s=>s.type===t));
  const filtered=SPOTS.filter(s=>(S.filter==="全部"||s.type===S.filter)&&(S.search===""||s.name.includes(S.search)||s.area.includes(S.search)));
  return{dayKeys,allAdded,addedIds,spotJPY,transTWD,flightTotal,expTWD,bpp,perPerson,grand,TYPES,filtered};
}

  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(k==="className")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else el.setAttribute(k,v);
  }
  for(const c of children.flat(Infinity)){if(c==null||c===false)continue;el.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return el;
}

// ── NAV ──
function buildRouteUrl(spots){
  if(spots.length===0) return null;
  if(spots.length===1) return gmapNav(spots[0]);
  const origin = encodeURIComponent(spots[0].name+" "+spots[0].area+" 東京");
  const dest   = encodeURIComponent(spots[spots.length-1].name+" "+spots[spots.length-1].area+" 東京");
  const waypts = spots.slice(1,-1).map(s=>encodeURIComponent(s.name+" "+s.area+" 東京")).join("|");
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=transit`;
  if(waypts) url += `&waypoints=${waypts}`;
  return url;
}
