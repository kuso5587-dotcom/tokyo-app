<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TØKYØ旅 2026 — Bocheng 設計</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--cream:#f0ebe0;--ink:#1a1211;--red:#c94a35;--gold:#b8860b;--muted:#7a6f65;--border:#c8bfb0;--white:#faf8f4;--tag:#ede6d8;--jr:#2d7a2d;--sub:#1a4a8a}
html,body{height:100%;background:var(--cream);color:var(--ink);font-family:'Noto Serif TC',serif;overflow:hidden}

.shell{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:var(--cream);position:relative;box-shadow:0 0 40px rgba(0,0,0,.15)}

/* TOP BAR */
.topbar{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo em{color:#e8a040;font-style:normal}
.badge{background:var(--red);color:#fff;font-family:'Space Mono',monospace;font-size:9px;padding:3px 8px;border-radius:2px;font-weight:700}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.on{display:flex}

/* BOTTOM NAV */
.bottomnav{display:flex;background:var(--ink);flex-shrink:0;border-top:1.5px solid #2a2a2a}
.bnav{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;color:#666;font-family:'Space Mono',monospace}
.bnav.on{color:#fff}
.bnav-ico{font-size:18px;line-height:1}
.bnav span{font-size:8px;letter-spacing:.3px}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

.sec-hd{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sec-title{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.sec-btn{padding:6px 12px;font-family:'Space Mono',monospace;font-size:10px;border:none;cursor:pointer;border-radius:2px}
.sec-btn.red{background:var(--red);color:#fff}
.sec-btn.ghost{background:none;border:1px solid var(--border);color:var(--ink)}

/* BOARDING PASS */
.bp{background:var(--white);border:1.5px solid var(--border);margin:12px 14px;border-radius:6px;overflow:hidden}
.bp-hd{background:var(--ink);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.bp-type{font-family:'Space Mono',monospace;font-size:9px;color:#aaa;letter-spacing:1px;text-transform:uppercase}
.bp-num{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:#e8a040}
.bp-route{display:flex;align-items:center;padding:14px;gap:8px}
.bp-code{font-family:'Space Mono',monospace;font-size:30px;font-weight:700}
.bp-citylbl{font-size:10px;color:var(--muted);margin-top:2px}
.bp-mid{flex:1;text-align:center;font-size:18px;color:var(--muted)}
.bp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 14px 10px;gap:8px}
.bp-cell{border-top:1px solid var(--border);padding-top:6px}
.bp-lbl{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.bp-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;margin-top:2px}
.bp-note{padding:8px 14px 10px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.bp-acts{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--border)}
.bp-act{flex:1;padding:7px;font-family:'Space Mono',monospace;font-size:10px;border:1px solid var(--border);background:none;cursor:pointer;border-radius:2px;text-align:center}
.bp-act.del{color:var(--red);border-color:#f5c6c6}
.add-bp-btn{margin:0 14px 14px;display:block;width:calc(100% - 28px);padding:12px;border:2px dashed var(--border);background:none;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;border-radius:4px;text-align:center}

/* CATEGORY */
.cat-item{padding:13px 14px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--white)}
.cat-item:active{background:var(--tag)}
.cat-ico{font-size:22px;width:28px;text-align:center}
.cat-lbl{font-size:14px;font-weight:700;flex:1}
.cat-cnt{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);background:var(--tag);padding:2px 8px;border-radius:10px}

/* SPOT ITEM */
.spot-item{padding:12px 14px;border-bottom:.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.spot-item:active{background:var(--tag)}
.spot-item.added{border-left:3px solid var(--jr)}
.si-emoji{font-size:24px;flex-shrink:0;width:30px;text-align:center;margin-top:2px}
.si-body{flex:1;min-width:0}
.si-name{font-size:13px;font-weight:700;line-height:1.3}
.si-sub{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:2px}
.si-foot{display:flex;align-items:center;gap:6px;margin-top:5px}
.stag{display:inline-block;font-family:'Space Mono',monospace;font-size:8px;padding:2px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.3px}
.si-add{padding:5px 12px;background:var(--red);color:#fff;border:none;cursor:pointer;font-family:'Space Mono',monospace;font-size:10px;border-radius:2px;margin-left:auto;flex-shrink:0}
.si-add.ok{background:var(--jr)}

/* SPOT DETAIL */
.sd-back{padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;cursor:pointer}
.sd-hero{padding:16px 14px 10px}
.sd-emoji{font-size:48px;margin-bottom:8px}
.sd-name{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;line-height:1.2}
.sd-en{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.sd-tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.sd-desc{font-size:13px;line-height:1.8;padding:0 14px;color:var(--ink)}
.tip-box{margin:12px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;padding:12px}
.tip-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.tip-txt{font-size:12px;line-height:1.7}
.sd-btns{display:flex;gap:8px;padding:14px;flex-shrink:0}
.sd-btn{flex:1;padding:13px;border:none;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;border-radius:2px}
.sd-btn.red{background:var(--red);color:#fff}
.sd-btn.blue{background:var(--sub);color:#fff}

/* PLAN */
.day-tabs{display:flex;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{padding:10px 16px;font-family:'Space Mono',monospace;font-size:10px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.dtab.on{color:var(--ink);border-bottom-color:var(--red)}
.plan-item{margin:8px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;display:flex;overflow:hidden}
.pi-time{background:var(--ink);color:#fff;width:50px;min-width:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;text-align:center;padding:8px 3px;line-height:1.5}
.pi-body{padding:9px 11px;flex:1}
.pi-name{font-size:13px;font-weight:700}
.pi-meta{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:2px}
.pi-acts{display:flex;gap:6px;margin-top:6px}
.pi-btn{font-size:9px;padding:3px 10px;border:1px solid var(--border);background:none;cursor:pointer;font-family:'Space Mono',monospace;border-radius:2px}
.pi-btn.del{color:var(--red);border-color:#f5c6c6}

/* EXPENSE */
.member-chips{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.member-chips::-webkit-scrollbar{display:none}
.mchip{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;white-space:nowrap;font-size:11px;flex-shrink:0;background:var(--white)}
.add-exp-bar{padding:10px 14px;background:var(--white);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.exp-row{display:flex;gap:7px;align-items:center}
.einput{padding:9px 10px;border:1.5px solid var(--border);background:var(--cream);font-family:'Noto Serif TC',serif;font-size:12px;outline:none;border-radius:2px}
.einput:focus{border-color:var(--red)}
.spt-row{display:flex;gap:4px}
.spt{padding:6px 11px;font-family:'Space Mono',monospace;font-size:9px;border:1.5px solid var(--border);background:none;cursor:pointer;border-radius:2px;color:var(--muted)}
.spt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ecard{margin:8px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;display:flex;overflow:hidden}
.ecard-bar{width:4px;flex-shrink:0}
.ecard-body{padding:10px 12px;flex:1}
.ecard-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.ecard-name{font-size:13px;font-weight:700;flex:1}
.ecard-amt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
.av{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.ebadge{font-family:'Space Mono',monospace;font-size:8px;padding:1px 6px;border-radius:8px}
.eshares{margin-top:8px;padding-top:8px;border-top:.5px solid var(--border)}
.esrow{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:11px}
.esbar{flex:1;height:4px;background:var(--tag);border-radius:2px;overflow:hidden}
.esfill{height:100%;border-radius:2px}
.esval{font-family:'Space Mono',monospace;font-size:9px;min-width:65px;text-align:right;color:var(--gold)}

/* SETTLE */
.ss-card{margin:7px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;padding:12px;display:flex;align-items:center;gap:10px}
.ss-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.ss-name{font-size:13px;font-weight:700}
.ss-nums{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}
.ss-status{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;margin-top:3px}
.tx-card{margin:0 14px 8px;background:var(--white);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.tx-hd{padding:7px 12px;background:var(--tag);font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.tx-row{padding:10px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px}
.tx-row:last-child{border-bottom:none}
.tx-amt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--red);flex:0 0 80px;text-align:center}

/* TRANSIT */
.tr-card{margin:0 14px 7px;background:var(--white);border:.5px solid var(--border);border-radius:4px;padding:11px 12px;display:flex;gap:9px}
.tr-bar{width:3px;border-radius:2px;flex-shrink:0;min-height:40px}
.tr-name{font-size:12px;font-weight:700;font-family:'Space Mono',monospace}
.tr-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.tr-meta{display:flex;gap:10px;margin-top:4px;font-size:9px;font-family:'Space Mono',monospace;flex-wrap:wrap}

/* MODAL */
.overlay{position:absolute;inset:0;background:rgba(26,18,17,.6);z-index:100;display:none;align-items:flex-end}
.overlay.on{display:flex}
.mbox{background:var(--cream);width:100%;max-height:90vh;overflow-y:auto;border-radius:14px 14px 0 0;border-top:2px solid var(--ink);padding:16px 16px 28px}
.mbox::-webkit-scrollbar{display:none}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.mt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;margin-bottom:12px}
.ml{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;display:block;margin:9px 0 3px}
.mi,.ms{width:100%;padding:10px 11px;border:1.5px solid var(--border);background:var(--white);font-family:'Noto Serif TC',serif;font-size:13px;outline:none;border-radius:2px}
.mi:focus,.ms:focus{border-color:var(--red)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mok{flex:1;padding:13px;background:var(--red);color:#fff;border:none;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;border-radius:2px}
.mcancel{padding:13px 16px;border:1.5px solid var(--border);background:none;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;border-radius:2px}
.color-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.cpick{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cpick.sel{border-color:var(--ink)}
.cb-list{display:flex;flex-direction:column;gap:6px;margin-top:5px}
.cb-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);cursor:pointer;border-radius:3px;font-size:12px}
.cb-item.on{background:#f9e8e5;border-color:var(--red)}
.cb-av{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}

.empty-state{padding:50px 20px;text-align:center;color:var(--muted)}
.empty-ico{font-size:40px;margin-bottom:10px}
.empty-txt{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.5px;line-height:1.8}

.tag-s{background:#e8f0fa;color:#1a4a8a}
.tag-f{background:#fef3e2;color:#9a5800}
.tag-t{background:#fde8f5;color:#8b1a6b}
.tag-r{background:#e8f5e8;color:#1a6b1a}
.tag-sh{background:#fce8e8;color:#8b1a1a}
.tag-n{background:#eefae8;color:#1a6b2a}
.tag-ni{background:#1a1a2e;color:#e0d0ff}
.tag-o{background:#fff0e8;color:#8b3a1a}
.tag-a{background:#f0e8f8;color:#4a1a8b}
.tag-h{background:#f5f0e8;color:#5a3a1a}

/* SEARCH BAR */
.sbar{padding:8px 14px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0}
.sbar input{width:100%;padding:8px 12px;border:1.5px solid var(--border);background:var(--cream);font-family:'Noto Serif TC',serif;font-size:13px;outline:none;border-radius:2px}
.sbar input:focus{border-color:var(--red)}

/* AG */
.ag-card{margin:0 14px 7px;background:var(--white);border:.5px solid var(--border);border-radius:4px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ag-ico{font-size:22px;flex-shrink:0}
.ag-name{font-size:12px;font-weight:700}
.ag-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
</style>
</head>
<body>
<div class="shell" id="shell">

<div class="topbar">
  <div>
    <div class="logo">T<em>Ø</em>KY<em>Ø</em>旅 2026</div>
    <div style="font-size:9px;color:#888;font-family:'Space Mono',monospace;letter-spacing:1px;margin-top:1px">日本東京行 × Bocheng 設計</div>
  </div>
  <span class="badge" id="topBadge">5D · 3P</span>
</div>

<!-- ① FLIGHT -->
<div class="screen on" id="s-flight">
  <div class="sec-hd">
    <div class="sec-title">✈ 航班</div>
    <button class="sec-btn red" onclick="openFlightModal()">+ 新增航班</button>
  </div>
  <div class="scroll" id="flightList"></div>
</div>

<!-- ② SPOT CATEGORIES -->
<div class="screen" id="s-spots">
  <div class="sec-hd">
    <div class="sec-title">🗾 景點分類</div>
    <button class="sec-btn ghost" onclick="openManualModal()">+ 自訂景點</button>
  </div>
  <div class="scroll" id="catList"></div>
</div>

<!-- ③ SPOT LIST -->
<div class="screen" id="s-spotlist">
  <div class="sec-hd" style="cursor:pointer" onclick="goTo('s-spots')">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:20px;color:var(--muted)">←</span>
      <div class="sec-title" id="spotlistTitle">景點</div>
    </div>
  </div>
  <div class="sbar"><input id="searchInput" placeholder="🔍 搜尋景點名稱、地區..." oninput="renderSpotList()"></div>
  <div class="scroll" id="spotListEl"></div>
</div>

<!-- ④ SPOT DETAIL -->
<div class="screen" id="s-detail">
  <div class="sd-back" onclick="goTo('s-spotlist')">
    <span style="font-size:20px;color:var(--muted)">←</span>
    <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.5px">返回列表</span>
  </div>
  <div class="scroll">
    <div id="spotDetailEl"></div>
    <div class="sd-btns" id="sdBtns"></div>
  </div>
</div>

<!-- ⑤ PLAN -->
<div class="screen" id="s-plan">
  <div style="flex-shrink:0">
    <div class="day-tabs" id="dayTabs"></div>
    <div style="display:flex;gap:6px;padding:8px 14px;background:var(--white);border-bottom:1px solid var(--border)">
      <button class="sec-btn ghost" onclick="addDay()" style="font-size:10px">+ 新增天</button>
      <button class="sec-btn ghost" onclick="openManualModal()" style="font-size:10px">+ 景點</button>
      <button class="sec-btn red" onclick="navDay()" style="flex:1;font-size:10px">🗺 一鍵導航全程</button>
    </div>
  </div>
  <div class="scroll" id="planList"></div>
</div>

<!-- ⑥ EXPENSE -->
<div class="screen" id="s-expense">
  <div style="flex-shrink:0">
    <div class="member-chips" id="memberChips"></div>
    <div class="add-exp-bar">
      <div class="exp-row">
        <input class="einput" id="eName" placeholder="消費名稱（例：一蘭拉麵）" style="flex:1">
        <input class="einput" id="eAmt" type="number" placeholder="¥" style="width:85px">
      </div>
      <div class="exp-row">
        <select class="einput" id="ePayer" style="flex:1;cursor:pointer"></select>
        <div class="spt-row">
          <button class="spt on" onclick="setSplit('equal',this)">平均</button>
          <button class="spt" onclick="setSplit('custom',this)">自訂</button>
          <button class="spt" onclick="setSplit('solo',this)">個人</button>
        </div>
        <button id="customBtn" onclick="openSplitModal()" style="display:none;padding:6px 10px;border:1px solid var(--border);background:none;cursor:pointer;font-size:14px;border-radius:2px">⚙</button>
      </div>
      <button class="mok" style="width:100%;border-radius:2px" onclick="addExpense()">+ 記錄消費</button>
    </div>
  </div>
  <div class="scroll" id="expList"></div>
</div>

<!-- ⑦ SETTLE -->
<div class="screen" id="s-settle">
  <div class="sec-hd">
    <div class="sec-title">⚖ 費用結算</div>
    <button class="sec-btn red" onclick="openAddMemberModal()">+ 新增旅伴</button>
  </div>
  <div class="scroll" id="settleEl"></div>
</div>

<!-- ⑧ TRANSIT -->
<div class="screen" id="s-transit">
  <div class="sec-hd"><div class="sec-title">🚇 東京交通指南</div></div>
  <div class="scroll" id="transitEl"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
  <button class="bnav on" onclick="nav('flight',this)"><div class="bnav-ico">✈</div><span>航班</span></button>
  <button class="bnav" onclick="nav('spots',this)"><div class="bnav-ico">🗾</div><span>景點</span></button>
  <button class="bnav" onclick="nav('plan',this)"><div class="bnav-ico">📅</div><span>行程</span></button>
  <button class="bnav" onclick="nav('expense',this)"><div class="bnav-ico">💴</div><span>費用</span></button>
  <button class="bnav" onclick="nav('settle',this)"><div class="bnav-ico">⚖</div><span>結算</span></button>
  <button class="bnav" onclick="nav('transit',this)"><div class="bnav-ico">🚇</div><span>交通</span></button>
</div>

<!-- MODALS -->
<div class="overlay" id="flightModal">
  <div class="mbox">
    <div class="mhandle"></div>

<script>
const COLORS=['#c94a35','#2980b9','#27ae60','#8e44ad','#e67e22','#16a085','#d35400','#2c3e50','#1abc9c','#c0392b'];
const TCAT={sight:'tag-s',food:'tag-f',toy:'tag-t',secret:'tag-r',shop:'tag-sh',nature:'tag-n',night:'tag-ni',onsen:'tag-o',art:'tag-a',hotel:'tag-h'};
const TLBL={sight:'景點',food:'美食',toy:'玩具',secret:'私藏',shop:'購物',nature:'自然',night:'夜景',onsen:'溫泉',art:'藝術',hotel:'住宿'};
const CATS=[{id:'sight',ico:'🏮',lbl:'必去景點'},{id:'food',ico:'🍜',lbl:'必吃美食'},{id:'toy',ico:'🧸',lbl:'公仔・玩具'},{id:'secret',ico:'🔑',lbl:'隱藏景點'},{id:'shop',ico:'🛍',lbl:'購物血拼'},{id:'nature',ico:'🌸',lbl:'自然風景'},{id:'night',ico:'🌙',lbl:'夜景・夜活'},{id:'onsen',ico:'♨️',lbl:'溫泉・SPA'},{id:'art',ico:'🎭',lbl:'藝術・文化'},{id:'hotel',ico:'🏨',lbl:'住宿推薦'}];

const SPOTS=[
  {id:1,cat:'sight',name:'淺草寺・仲見世',en:'Senso-ji',area:'淺草',cost:0,dur:'2小時',emoji:'🏮',desc:'東京最古老寺廟，建於628年。仲見世商店街充滿江戶風情，雷門大燈籠是最具代表性打卡地點。',tip:'建議早上8點前到，光線最美且沒人潮。'},
  {id:2,cat:'sight',name:'晴空塔 SKYTREE',en:'Tokyo Skytree',area:'押上',cost:2100,dur:'2小時',emoji:'🗼',desc:'高634公尺，世界第二高建築，可360度俯瞰東京全景。展望台分350m天望甲板和450m天望回廊兩層。',tip:'傍晚5-7點黃金時段，可同時看到日落和夜景。'},
  {id:3,cat:'sight',name:'明治神宮',en:'Meiji Jingu',area:'原宿',cost:0,dur:'1.5小時',emoji:'⛩',desc:'供奉明治天皇的大型神社，位於70公頃的森林中，是東京最著名的神社之一。每年元旦有超過300萬人前來初詣。',tip:'穿越70公尺大鳥居走到本殿，清晨最有氣氛。'},
  {id:4,cat:'sight',name:'新宿御苑',en:'Shinjuku Gyoen',area:'新宿',cost:500,dur:'2小時',emoji:'🌿',desc:'58公頃的國家庭園，結合日、法、英三種庭園風格，春天賞櫻聖地，可容納1萬人野餐。',tip:'春季3月下旬至4月中賞櫻最美，建議平日前往避開人潮。'},
  {id:5,cat:'sight',name:'渋谷十字路口',en:'Shibuya Crossing',area:'渋谷',cost:0,dur:'30分鐘',emoji:'🚦',desc:'全球最繁忙路口之一，每次綠燈約3000人同時過馬路，是東京最震撼的景象之一。',tip:'Shibuya Sky屋頂可以完美俯瞰整個路口，收費但視野最好。'},
  {id:6,cat:'sight',name:'東京鐵塔',en:'Tokyo Tower',area:'芝公園',cost:1200,dur:'1.5小時',emoji:'🗼',desc:'高332.9公尺，以埃菲爾鐵塔為原型設計，塗裝成國際橘白色，夜晚點燈後是東京最浪漫景點之一。',tip:'從增上寺拍有寺廟前景的東京鐵塔，超級美。'},
  {id:7,cat:'sight',name:'淺草文化觀光中心屋頂',en:'Asakusa Culture Center',area:'淺草',cost:0,dur:'30分鐘',emoji:'🏢',desc:'8樓屋頂正對雷門和淺草寺，是拍攝雷門最好的免費角度，幾乎沒人知道這個秘密！',tip:'免費！幾乎沒有排隊，比晴空塔更推薦的隱藏拍攝點。'},
  {id:8,cat:'sight',name:'台場・彩虹橋',en:'Odaiba Rainbow Bridge',area:'台場',cost:0,dur:'2小時',emoji:'🗽',desc:'台場海濱公園有1:7自由女神像複製品，彩虹橋和東京灣夜景極為美麗，情侶聖地。',tip:'夜晚7點後彩虹橋全亮，是拍夜景的最佳時機。'},
  {id:9,cat:'sight',name:'皇居外苑・二重橋',en:'Imperial Palace',area:'丸之內',cost:0,dur:'1小時',emoji:'🏯',desc:'日本天皇居住的皇居，外苑對外開放。二重橋是最著名打卡景點，配合伏見櫓構成典雅日式畫面。',tip:'東廣場每天免費開放，可以看到護城河和石橋的美景。'},
  {id:10,cat:'food',name:'一蘭拉麵',en:'Ichiran Ramen',area:'全東京',cost:1200,dur:'45分鐘',emoji:'🍜',desc:'個人隔間式博多豚骨拉麵，可自選湯頭濃淡、麵條軟硬、辣度、蔥量，每個人獨享一個隔間。',tip:'秋葉原店、上野店、渋谷店都有，上野店相對人少。'},
  {id:11,cat:'food',name:'築地市場場外美食',en:'Tsukiji Outer Market',area:'築地',cost:2000,dur:'1.5小時',emoji:'🦞',desc:'玉子燒、生蠔、海膽飯、鮪魚串等各種新鮮海鮮，即使豐洲市場遷走，場外依然熱鬧。',tip:'早上8-9點最新鮮，週日部分攤位休息，記得提前查詢。'},
  {id:12,cat:'food',name:'新宿思い出横丁',en:'Memory Lane',area:'新宿',cost:3000,dur:'2小時',emoji:'🍢',desc:'昭和風情小巷，密密麻麻的居酒屋、烤雞肉串攤，煙霧瀰漫，充滿80年代日本氛圍。',tip:'入夜後才是最有氣氛的時候，建議晚上7點後前往。'},
  {id:13,cat:'food',name:'原宿竹下通可麗餅',en:'Takeshita Crepe',area:'原宿',cost:600,dur:'20分鐘',emoji:'🍦',desc:'竹下通的標誌性食物，各式口味的可麗餅卷成甜筒狀，邊走邊吃是原宿的必做體驗之一。',tip:'Marion Crepes是最老字號，Angel Heart口味更多。'},
  {id:14,cat:'food',name:'銀座壽司大',en:'Sushi Dai',area:'豐洲市場',cost:4000,dur:'2小時',emoji:'🍣',desc:'豐洲市場內排隊名店，主廚精選10貫+卷物，使用當天最新鮮食材，曾入選米其林必比登。',tip:'開店前1小時就要開始排隊，平日清晨5點較短。'},
  {id:15,cat:'food',name:'神樂坂法式小巷',en:'Kagurazaka',area:'神樂坂',cost:2500,dur:'1.5小時',emoji:'☕',desc:'東京的「小巴黎」，有許多法式餐廳和甜品店隱藏在石板小巷中，適合下午悠閒漫步品嚐。',tip:'志満金、KAGURAZAKA SARYO都是隱藏名店，石板路本身就很值得拍照。'},
  {id:16,cat:'toy',name:'玩趣總動員 Kiddy Land',en:'Kiddy Land Harajuku',area:'原宿',cost:3000,dur:'2小時',emoji:'🎠',desc:'原宿表參道旁的4層樓玩具天堂！卡通角色商品、史努比、Hello Kitty、三麗鷗全系列，大人小孩都瘋狂！',tip:'地下一樓有特價區，很多商品比機場免稅店便宜。'},
  {id:17,cat:'toy',name:'LEGO Store 新宿・東京站',en:'LEGO Store Tokyo',area:'新宿/東京站',cost:2000,dur:'1小時',emoji:'🧱',desc:'日本最大LEGO旗艦店，有台灣買不到的日本限定款，包括東京鐵塔、淺草寺、新幹線等限定組合。',tip:'東京站限定的東京主題LEGO是最棒的伴手禮！限量款記得一到就先搶購。'},
  {id:18,cat:'toy',name:'TOMICA・TOMY小汽車旗艦',en:'Tomica Shop',area:'東京站/台場',cost:2000,dur:'1小時',emoji:'🚗',desc:'Tomica是日本最經典的小比例合金車，東京站一番街的TOMICA SHOP有最齊全車款，還有地區限定版。',tip:'東京站限定的新幹線套組超值，一定要入手！可以當作親子伴手禮。'},
  {id:19,cat:'toy',name:'秋葉原扭蛋天堂',en:'Gashapon Hall',area:'秋葉原',cost:2000,dur:'1小時',emoji:'🪆',desc:'秋葉原的扭蛋大廳有超過500台扭蛋機，各種角色人偶、食玩、奇葩小物應有盡有，一枚200-500日圓。',tip:'Gashapon Bandai官方大廳在電器街北邊，機台最新最齊全。'},
  {id:20,cat:'toy',name:'Pokemon Center',en:'Pokemon Center',area:'渋谷/池袋',cost:3000,dur:'1小時',emoji:'⚡',desc:'寶可夢官方旗艦店，各種限定商品、限定款玩偶、文具、衣服，還有小型遊戲體驗區，粉絲必去！',tip:'池袋限定和渋谷限定商品不同，兩店都要跑！'},
  {id:21,cat:'toy',name:'Gundam Base Tokyo 台場',en:'Gundam Base',area:'台場',cost:2000,dur:'2小時',emoji:'🤖',desc:'高達官方旗艦展示基地，1:1大小高達立像、最新MG/RG/HG模型全系列、台場限定版。',tip:'台場限定的全彩高達是超人氣商品，限量要早去！'},
  {id:22,cat:'toy',name:'吉卜力 どんぐり共和国',en:'Donguri Kyowakoku',area:'新宿/原宿',cost:2500,dur:'1小時',emoji:'🌳',desc:'宮崎駿吉卜力作品周邊官方店，龍貓、千與千尋、魔女宅急便等角色商品齊全。',tip:'新宿京王百貨的分店最大，限定商品也最多。'},
  {id:23,cat:'secret',name:'谷中銀座・貓咪街',en:'Yanaka Ginza',area:'谷中',cost:500,dur:'1.5小時',emoji:'🐱',desc:'東京最後的昭和商店街，沒有被觀光化的在地生活感，有很多貓咪在街道遊走，被稱為「貓咪街」。',tip:'夕焼けだんだん石階是超美打卡點，下午4點後陽光最美。'},
  {id:24,cat:'secret',name:'等等力溪谷',en:'Todoroki Gorge',area:'世田谷',cost:0,dur:'1小時',emoji:'🌿',desc:'東京23區內唯一天然溪谷！就在住宅區旁，翠綠竹林、溪流、小橋，完全免費。',tip:'世田谷線等等力站步行2分鐘，幾乎沒有外國遊客，完全是當地人的秘密。'},
  {id:25,cat:'secret',name:'三鷹吉卜力美術館',en:'Ghibli Museum',area:'三鷹',cost:1000,dur:'2小時',emoji:'🎪',desc:'宮崎駿親自監修設計的博物館，展示吉卜力的創作過程和動畫製作。超受歡迎需提前抽籤購票。',tip:'台灣購票要透過Lawson，每月15日10點開搶下個月票，非常快售完！'},
  {id:26,cat:'secret',name:'根津神社千本鳥居',en:'Nezu Shrine',area:'文京',cost:0,dur:'1小時',emoji:'⛩',desc:'比伏見稻荷還要神秘的千本鳥居！規模較小但氣氛更幽靜，幾乎只有日本人知道的隱藏景點。',tip:'4月中下旬杜鵑花祭，1000株杜鵑盛開，超美且人少。'},
  {id:27,cat:'secret',name:'月島文字燒街',en:'Tsukishima Monjayaki',area:'月島',cost:2000,dur:'1.5小時',emoji:'🥞',desc:'東京下町特有的文字燒（もんじゃ焼き）發源地，整條商店街都是文字燒餐廳，是東京獨特的在地小吃。',tip:'自己在鐵板上烹調，店員會教你，比章魚燒更道地！'},
  {id:28,cat:'secret',name:'荒川路面電車',en:'Arakawa Line',area:'荒川',cost:170,dur:'1小時',emoji:'🚃',desc:'東京唯一的路面電車！從三ノ輪橋到早稲田全程12公里只要170日圓，穿越下町住宅區像穿越時光隧道。',tip:'全線搭完只要一小時，是東京最便宜的特殊交通體驗！'},
  {id:29,cat:'shop',name:'秋葉原電器街',en:'Akihabara',area:'秋葉原',cost:5000,dur:'3小時',emoji:'🖥',desc:'世界最大電子產品集散地，相機、電腦、家電、動漫周邊應有盡有，遊戲中心和女僕咖啡廳也是特色。',tip:'BIC Camera和Yodobashi比免稅店便宜，記得帶護照辦退稅（8%+）。'},
  {id:30,cat:'shop',name:'下北澤古著街',en:'Shimokitazawa Vintage',area:'下北澤',cost:3000,dur:'2小時',emoji:'👗',desc:'東京最大的古著（二手衣）聚集地，數十家個性古著店、唱片行、小劇場，充滿文青和音樂人。',tip:'thrift shop文化在這裡最盛行，可以找到超有個性的寶藏衣物。'},
  {id:31,cat:'nature',name:'高尾山登山',en:'Mt. Takao',area:'高尾',cost:480,dur:'4小時',emoji:'⛰',desc:'東京近郊最受歡迎的登山地點，海拔599公尺，秋天紅葉美景聞名。可搭纜車上山，晴天可看富士山。',tip:'天氣好的冬日（12-2月）從山頂可以清楚看到富士山！'},
  {id:32,cat:'night',name:'台場夜景・彩虹橋',en:'Odaiba Night View',area:'台場',cost:0,dur:'1.5小時',emoji:'🌉',desc:'從台場海濱公園看彩虹橋、東京灣和城市夜景，是東京最美的免費夜景之一，情侶聖地。',tip:'晚上7點後彩虹橋全亮，台場decks露台角度最好。'},
  {id:33,cat:'night',name:'新宿歌舞伎町',en:'Kabukicho Night',area:'新宿',cost:2000,dur:'2小時',emoji:'🎰',desc:'日本最大繁華街，霓虹燈招牌、居酒屋、遊戲中心，哥吉拉頭像和Toho Cinemas是新地標。',tip:'歌舞伎町一番街的哥吉拉夜晚有燈光表演，整點前後特別精彩。'},

function goTo(sid){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(sid).classList.add('on');curScreen=sid;}

function openFlightModal(){editFlightId=null;['f-from','f-to','f-fromcity','f-tocity','f-num','f-terminal','f-gate','f-seat','f-note'].forEach(i=>document.getElementById(i).value='');document.getElementById('f-date').value='';document.getElementById('f-dep').value='';document.getElementById('f-arr').value='';document.getElementById('f-type').value='去程';document.getElementById('fmTitle').textContent='新增航班';document.getElementById('fmOk').textContent='新增航班';document.getElementById('flightModal').classList.add('on');}
function editFlight(id){editFlightId=id;const f=flights.find(x=>x.id===id);if(!f)return;document.getElementById('f-from').value=f.from||'';document.getElementById('f-to').value=f.to||'';document.getElementById('f-fromcity').value=f.fromcity||'';document.getElementById('f-tocity').value=f.tocity||'';document.getElementById('f-num').value=f.num||'';document.getElementById('f-date').value=f.date||'';document.getElementById('f-terminal').value=f.terminal||'';document.getElementById('f-dep').value=f.dep||'';document.getElementById('f-arr').value=f.arr||'';document.getElementById('f-gate').value=f.gate||'';document.getElementById('f-seat').value=f.seat||'';document.getElementById('f-note').value=f.note||'';document.getElementById('f-type').value=f.type||'去程';document.getElementById('fmTitle').textContent='編輯航班';document.getElementById('fmOk').textContent='儲存修改';document.getElementById('flightModal').classList.add('on');}
function saveFlight(){const f={id:editFlightId||Date.now(),type:document.getElementById('f-type').value,from:document.getElementById('f-from').value.toUpperCase(),to:document.getElementById('f-to').value.toUpperCase(),fromcity:document.getElementById('f-fromcity').value,tocity:document.getElementById('f-tocity').value,num:document.getElementById('f-num').value,date:document.getElementById('f-date').value,terminal:document.getElementById('f-terminal').value,dep:document.getElementById('f-dep').value,arr:document.getElementById('f-arr').value,gate:document.getElementById('f-gate').value,seat:document.getElementById('f-seat').value,note:document.getElementById('f-note').value};if(editFlightId){const i=flights.findIndex(x=>x.id===editFlightId);if(i>=0)flights[i]=f;}else flights.push(f);save();closeM('flightModal');renderFlights();}

// SPOTS

    const cnt=allSpots().filter(s=>s.cat===c.id).length;
    return `<div class="cat-item" onclick="openCat('${c.id}','${c.lbl}')"><span class="cat-ico">${c.ico}</span><span class="cat-lbl">${c.lbl}</span><span class="cat-cnt">${cnt}</span><span style="color:var(--muted);font-size:18px">›</span></div>`;
  }).join('')+`<div class="cat-item" onclick="openCat('all','全部 ${allSpots().length} 個景點')"><span class="cat-ico">🗾</span><span class="cat-lbl" style="color:var(--muted)">全部景點</span><span class="cat-cnt">${allSpots().length}</span><span style="color:var(--muted);font-size:18px">›</span></div>`;
}
function openCat(id,lbl){curCat=id;document.getElementById('spotlistTitle').textContent=lbl;document.getElementById('searchInput').value='';renderSpotList();goTo('s-spotlist');}

  if(q)spots=spots.filter(s=>s.name.toLowerCase().includes(q)||(s.area||'').toLowerCase().includes(q)||(s.en||'').toLowerCase().includes(q));
  const inPlan=new Set(plan.days.flatMap(d=>d.items.map(i=>i.spotId)));
  document.getElementById('spotListEl').innerHTML=spots.length?spots.map(s=>`
    <div class="spot-item${inPlan.has(s.id)?' added':''}" onclick="openSpotDetail(${s.id})">
      <span class="si-emoji">${s.emoji}</span>
      <div class="si-body">
        <div class="si-name">${s.name}</div>

        <div class="si-foot">
          <span class="stag ${TCAT[s.cat]||''}">${TLBL[s.cat]||''}</span>
          ${inPlan.has(s.id)?'<span style="font-size:10px;color:var(--jr);margin-left:auto;font-family:Space Mono,monospace">✓ 已加入行程</span>':''}
        </div>
      </div>
      <button class="si-add${inPlan.has(s.id)?' ok':''}" onclick="event.stopPropagation();openPlanModal(${s.id})">${inPlan.has(s.id)?'✓':'+'}</button>
    </div>`).join(''):'<div class="empty-state"><div class="empty-ico">🔍</div><div class="empty-txt">找不到相關景點</div></div>';

function openSpotDetail(id){
  selSpotId=id;const s=allSpots().find(x=>x.id===id);if(!s)return;
  const inPlan=new Set(plan.days.flatMap(d=>d.items.map(i=>i.spotId)));const isIn=inPlan.has(id);
  document.getElementById('spotDetailEl').innerHTML=`<div class="sd-hero"><div class="sd-emoji">${s.emoji}</div><div class="sd-name">${s.name}</div><div class="sd-en">${s.en||''} · ${s.area||''}</div><div class="sd-tags"><span class="stag ${TCAT[s.cat]||''}">${TLBL[s.cat]||''}</span>${s.cost?`<span class="stag" style="background:#fef3e2;color:#9a5800">¥${s.cost.toLocaleString()}</span>`:'<span class="stag" style="background:#e8f5e8;color:#1a6b1a">免費</span>'}${s.dur?`<span class="stag" style="background:var(--tag);color:var(--muted)">${s.dur}</span>`:''}</div></div><div class="sd-desc">${s.desc||''}</div>${s.tip?`<div class="tip-box"><div class="tip-lbl">✦ 旅遊秘笈</div><div class="tip-txt">${s.tip}</div></div>`:''}`;

  goTo('s-detail');
}
function openPlanModal(id){addingSpotId=id;document.getElementById('pm-day').innerHTML=plan.days.map((d,i)=>`<option value="${i}">Day ${i+1} — ${d.title}</option>`).join('');document.getElementById('planModal').classList.add('on');}
function confirmPlan(){const di=+document.getElementById('pm-day').value;const time=document.getElementById('pm-time').value;const note=document.getElementById('pm-note').value;if(!plan.days[di].items.find(i=>i.spotId===addingSpotId)){plan.days[di].items.push({spotId:addingSpotId,time,note});plan.days[di].items.sort((a,b)=>a.time.localeCompare(b.time));}save();closeM('planModal');if(curScreen==='s-spotlist')renderSpotList();if(curScreen==='s-detail')openSpotDetail(selSpotId);if(curScreen==='s-plan')renderPlan();}

// PLAN
function renderPlan(){
  document.getElementById('dayTabs').innerHTML=plan.days.map((d,i)=>`<button class="dtab${i===curDay?' on':''}" onclick="curDay=${i};renderPlan()">Day ${i+1}</button>`).join('');
  const day=plan.days[curDay];const el=document.getElementById('planList');
  if(!day.items.length){el.innerHTML='<div class="empty-state"><div class="empty-ico">📅</div><div class="empty-txt">從景點頁面點「+」加入行程<br>或點上方「+ 景點」手動新增</div></div>';return;}
  const total=day.items.reduce((a,item)=>{const s=allSpots().find(x=>x.id===item.spotId);return a+(s?.cost||0);},0);
  el.innerHTML=`<div style="margin:8px 14px;padding:10px 12px;background:var(--white);border:1px solid var(--border);border-radius:4px;display:flex;justify-content:space-between;align-items:center"><span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">今日預估費用</span><span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--gold)">¥${total.toLocaleString()}</span></div>`+
  day.items.map((item,i)=>{const s=allSpots().find(x=>x.id===item.spotId);if(!s)return '';
    return `<div class="plan-item"><div class="pi-time">${item.time||'--:--'}<span style="font-size:7px;margin-top:1px;color:#aaa">${item.time?+item.time.split(':')[0]<12?'AM':'PM':''}</span></div><div class="pi-body"><div class="pi-name">${s.emoji} ${s.name}</div><div class="pi-meta">${s.area||''} · ${s.cost?'¥'+s.cost.toLocaleString():'免費'}${item.note?' · 📝'+item.note:''}</div><div class="pi-acts"><button class="pi-btn" onclick="navTo('${s.name}')">🗺 導航</button><button class="pi-btn del" onclick="plan.days[${curDay}].items.splice(${i},1);save();renderPlan()">✕ 刪除</button></div></div></div>`;
  }).join('');
}
function addDay(){plan.days.push({title:'新行程 '+(plan.days.length+1),items:[]});curDay=plan.days.length-1;save();renderPlan();}
function navDay(){const places=plan.days[curDay].items.map(i=>{const s=allSpots().find(x=>x.id===i.spotId);return s?.name}).filter(Boolean);if(!places.length)return alert('本日尚無景點，請先加入景點');alert('請複製以下路線到Google Maps：\n\n'+places.join(' → '));}
function navTo(name){alert('請在Google Maps搜尋：\n\n'+name+'\n\n（手機版可直接打開Maps App搜尋）');}
function openManualModal(){['man-name','man-area','man-desc','man-tip'].forEach(i=>document.getElementById(i).value='');document.getElementById('man-cost').value='';document.getElementById('man-emoji').value='📍';document.getElementById('man-cat').value='sight';document.getElementById('manualModal').classList.add('on');}

function renderExpenseList(){
  let exps=expenses;
  if(selMember!=='all')exps=expenses.filter(e=>e.payerId==selMember||Object.keys(e.splits||{}).includes(String(selMember)));
  const el=document.getElementById('expList');
  if(!exps.length){el.innerHTML='<div class="empty-state"><div class="empty-ico">💴</div><div class="empty-txt">先新增旅伴<br>再開始記錄消費</div></div>';return;}
  const total=exps.reduce((a,e)=>a+e.amount,0);
  el.innerHTML=`<div style="margin:8px 14px;padding:10px 12px;background:var(--white);border:1px solid var(--border);border-radius:4px;display:flex;justify-content:space-between"><span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">${selMember==='all'?'總消費':'篩選後消費'}</span><span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--gold)">¥${total.toLocaleString()}</span></div>`+
  [...exps].reverse().map(e=>{
    const payer=members.find(m=>m.id===e.payerId)||{name:'?',color:'#999',emoji:'?'};
    const tl={equal:'平均分攤',custom:'自訂分攤',solo:'個人費用'}[e.splitType]||'';
    const tc={equal:'background:#e8f0fa;color:#1a4a8a',custom:'background:#fef3e2;color:#9a5800',solo:'background:#f9e8e5;color:#8b1a1a'}[e.splitType]||'';
    const shareRows=Object.entries(e.splits||{}).map(([mid,val])=>{const m=members.find(x=>x.id==mid);if(!m||!val)return '';const pct=Math.round(val/e.amount*100);return `<div class="esrow"><div class="av" style="background:${m.color}">${m.emoji}</div><span style="flex:0 0 44px">${m.name}</span><div class="esbar"><div class="esfill" style="width:${pct}%;background:${m.color}"></div></div><span class="esval">¥${val.toLocaleString()} (${pct}%)</span></div>`;}).filter(Boolean).join('');
    return `<div class="ecard"><div class="ecard-bar" style="background:${payer.color}"></div><div class="ecard-body"><div class="ecard-top"><div class="ecard-name">${e.name}</div><div class="ecard-amt">¥${e.amount.toLocaleString()}</div><button style="font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 6px" onclick="if(confirm('刪除此消費？')){expenses=expenses.filter(x=>x.id!=${e.id});save();renderMemberChips();renderExpenseList()}">✕</button></div><div class="ecard-meta"><div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)"><div class="av" style="background:${payer.color}">${payer.emoji}</div>${payer.name} 付款</div><span class="ebadge" style="${tc}">${tl}</span><span style="font-family:'Space Mono',monospace;font-size:8px;color:var(--muted)">${e.date}</span></div>${shareRows?`<div class="eshares">${shareRows}</div>`:''}</div></div>`;
  }).join('');
}
function setSplit(t,btn){splitType=t;document.querySelectorAll('.spt').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('customBtn').style.display=t==='custom'?'block':'none';customSplit={};}
function openSplitModal(){const amt=+document.getElementById('eAmt').value||0;const per=members.length?Math.round(amt/members.length):0;document.getElementById('splitGrid').innerHTML=members.map(m=>`<div class="cb-item on" id="cb_${m.id}" onclick="toggleCS(${m.id})"><div class="cb-av" style="background:${m.color}">${m.emoji}</div><span style="flex:1">${m.name}</span><input type="number" id="cs_${m.id}" value="${customSplit[m.id]??per}" min="0" style="width:80px;padding:6px 8px;border:1px solid var(--border);font-family:'Space Mono',monospace;font-size:12px;text-align:right;border-radius:2px" onclick="event.stopPropagation()" oninput="updRem()"> ¥</div>`).join('');members.forEach(m=>{if(customSplit[m.id]===undefined)customSplit[m.id]=per;});updRem();document.getElementById('splitModal').classList.add('on');}
function toggleCS(id){const el=document.getElementById('cb_'+id);el.classList.toggle('on');if(!el.classList.contains('on')){customSplit[id]=0;document.getElementById('cs_'+id).value=0;}updRem();}
function updRem(){const amt=+document.getElementById('eAmt').value||0;const used=members.reduce((a,m)=>a+(+document.getElementById('cs_'+m.id)?.value||0),0);const rem=amt-used;document.getElementById('splitRem').textContent=`已分配 ¥${used.toLocaleString()} ／ 總額 ¥${amt.toLocaleString()} ／ 剩餘 ¥${rem.toLocaleString()}`;}
function confirmSplit(){members.forEach(m=>{customSplit[m.id]=+document.getElementById('cs_'+m.id)?.value||0;});closeM('splitModal');}
function addExpense(){const name=document.getElementById('eName').value.trim();const amt=+document.getElementById('eAmt').value;const payerId=+document.getElementById('ePayer').value;if(!name||!amt)return alert('請填寫消費名稱和金額');if(!members.length)return alert('請先新增旅伴（點上方旅伴頭像旁的 + 按鈕）');let splits={};if(splitType==='equal'){const per=Math.round(amt/members.length);members.forEach(m=>splits[m.id]=per);}else if(splitType==='solo'){splits[payerId]=amt;}else{splits={...customSplit};if(!Object.keys(splits).length){const per=Math.round(amt/members.length);members.forEach(m=>splits[m.id]=per);}}expenses.push({id:Date.now(),name,amount:amt,payerId,splitType,splits,date:new Date().toLocaleDateString('zh-TW')});document.getElementById('eName').value='';document.getElementById('eAmt').value='';customSplit={};save();renderMemberChips();renderExpenseList();}
function openAddMemberModal(){editMemberId=null;document.getElementById('mm-name').value='';document.getElementById('mm-emoji').value='😊';document.getElementById('mmTitle').textContent='新增旅伴';document.getElementById('mmOk').textContent='新增旅伴';renderColorPick(COLORS[members.length%COLORS.length]);document.getElementById('memberModal').classList.add('on');}
function renderColorPick(sel){selColor=sel||COLORS[0];document.getElementById('colorPick').innerHTML=COLORS.map(c=>`<div class="cpick${c===sel?' sel':''}" style="background:${c}" onclick="selColor='${c}';renderColorPick('${c}')"></div>`).join('');}
function saveMember(){const name=document.getElementById('mm-name').value.trim();if(!name)return alert('請輸入旅伴姓名');const emoji=document.getElementById('mm-emoji').value||'😊';if(editMemberId){const m=members.find(x=>x.id===editMemberId);if(m){m.name=name;m.emoji=emoji;m.color=selColor;}}else members.push({id:Date.now(),name,emoji,color:selColor});save();closeM('memberModal');renderMemberChips();updateBadge();}

// SETTLE
function renderSettle(){
  const el=document.getElementById('settleEl');
  if(!members.length){el.innerHTML='<div class="empty-state"><div class="empty-ico">👥</div><div class="empty-txt">請先新增旅伴<br>點右上角「+ 新增旅伴」</div></div>';return;}
  const paid={},owed={};
  members.forEach(m=>{paid[m.id]=0;owed[m.id]=0;});
  expenses.forEach(e=>{if(paid[e.payerId]!==undefined)paid[e.payerId]+=e.amount;Object.entries(e.splits||{}).forEach(([mid,val])=>{if(owed[mid]!==undefined)owed[mid]+=val;});});
  const bal={};members.forEach(m=>{bal[m.id]=paid[m.id]-owed[m.id];});
  const total=expenses.reduce((a,e)=>a+e.amount,0);
  const dc=members.filter(m=>bal[m.id]<0).map(m=>({m,amt:-bal[m.id]}));
  const cc=members.filter(m=>bal[m.id]>0).map(m=>({m,amt:bal[m.id]}));
  const txs=[];const dcp=[...dc.map(x=>({...x}))];const ccp=[...cc.map(x=>({...x}))];
  let di=0,ci=0;while(di<dcp.length&&ci<ccp.length){const d=dcp[di],c=ccp[ci];const amt=Math.min(d.amt,c.amt);if(amt>0)txs.push({from:d.m,to:c.m,amt});d.amt-=amt;c.amt-=amt;if(d.amt<=0)di++;if(c.amt<=0)ci++;}
  el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 14px"><div style="background:var(--white);border:1px solid var(--border);border-radius:4px;padding:11px;text-align:center"><div style="font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px">總費用</div><div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;margin-top:4px">¥${total.toLocaleString()}</div></div><div style="background:var(--white);border:1px solid var(--border);border-radius:4px;padding:11px;text-align:center"><div style="font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px">平均每人</div><div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--gold);margin-top:4px">¥${members.length?Math.round(total/members.length).toLocaleString():0}</div></div><div style="background:var(--white);border:1px solid var(--border);border-radius:4px;padding:11px;text-align:center"><div style="font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px">台幣約</div><div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;margin-top:4px">NT${Math.round(total*0.22).toLocaleString()}</div></div></div>
  <div style="padding:4px 14px 6px"><div style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:4px;color:var(--muted)">旅伴結算明細</div></div>
  ${members.map(m=>{const b=bal[m.id];const st=b>0?`+¥${b.toLocaleString()} 被還款`:b<0?`-¥${Math.abs(b).toLocaleString()} 需還款`:'✓ 已結清';const sc=b>0?'#1a7a1a':b<0?'var(--red)':'var(--muted)';return `<div class="ss-card"><div class="ss-av" style="background:${m.color}">${m.emoji}</div><div style="flex:1"><div class="ss-name">${m.name}</div><div class="ss-nums">付出 ¥${paid[m.id].toLocaleString()} · 應付 ¥${owed[m.id].toLocaleString()}</div><div class="ss-status" style="color:${sc}">${st}</div></div></div>`;}).join('')}
  <div style="padding:10px 14px 4px"><div style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:4px;color:var(--muted)">💸 還款清單（最優化）</div></div>
  <div class="tx-card">${txs.length?txs.map(t=>`<div class="tx-row"><div class="av" style="background:${t.from.color}">${t.from.emoji}</div><span style="flex:1">${t.from.name}</span><div class="tx-amt">→ ¥${t.amt.toLocaleString()}</div><span style="flex:1;text-align:right">${t.to.name}</span><div class="av" style="background:${t.to.color}">${t.to.emoji}</div></div>`).join(''):'<div style="padding:14px 12px;font-family:\'Space Mono\',monospace;font-size:11px;color:#1a7a1a;text-align:center">✓ 所有帳目已結清！</div>'}</div>
  <div style="padding:12px 14px"><button style="width:100%;padding:12px;background:none;border:1.5px solid var(--border);font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;border-radius:2px" onclick="openAddMemberModal()">+ 新增旅伴</button></div>`;
}

    {n:'東京Metro 千代田線（C）',c:'#00a84f',d:'連接原宿表參道・代々木上原，和風名所最方便',p:'170-210',t:'明治神宮前→表参道約2分'},
    {n:'都営大江戸線（E）',c:'#b51e82',d:'新宿・六本木・汐留・両国・飯田橋環狀，連接六本木和下町',p:'180-310',t:'新宿→六本木約15分'},
    {n:'都営浅草線（A）',c:'#e84040',d:'押上（晴空塔）・淺草・日本橋・新橋，可直通成田/羽田機場',p:'180-310',t:'淺草→日本橋約8分'},
    {n:'ゆりかもめ（台場線）',c:'#008c4a',d:'新橋・台場・豐洲，前往台場最便利路線，高架無人駕駛電車',p:'200-320',t:'新橋→台場約13分'},
    {n:'りんかい線',c:'#005bab',d:'大崎・台場・新木場，可直通JR埼京線到新宿・池袋',p:'260-400',t:'大崎→台場約17分'},
    {n:'東急東横線',c:'#e60012',d:'渋谷・中目黒・自由が丘・横浜，連接東京和橫濱',p:'170-300',t:'渋谷→横浜約30分'},
    {n:'京成スカイライナー',c:'#002087',d:'成田機場・日暮里・上野，比N\'EX便宜，日暮里轉山手線方便',p:'2570（日暮里）',t:'成田→日暮里約41分'},
    {n:'Suica / PASMO IC卡',c:'#1a7cba',d:'可在JR・地鐵・巴士・便利商店等幾乎所有場合使用，台灣人建議購買 WELCOME Suica',p:'500日圓押金+儲值',t:'感應即過閘'},
    {n:'都バス 均一運賃',c:'#ff6b35',d:'東京都內公共巴士，均一費用210日圓（IC卡206日圓），可到地鐵到不了的地方',p:'210（IC卡206）',t:'依路線不同'},
  ];
  document.getElementById('transitEl').innerHTML=`<div style="padding:8px 14px 2px"><div style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0 8px;border-bottom:1.5px solid var(--border);color:var(--muted)">🟢 JR 電車</div></div>`+
  lines.slice(0,4).map(l=>`<div class="tr-card"><div class="tr-bar" style="background:${l.c}"></div><div><div class="tr-name">${l.n}</div><div class="tr-desc">${l.d}</div><div class="tr-meta"><span style="color:var(--gold)">¥${l.p}</span><span style="color:var(--muted)">⏱ ${l.t}</span></div></div></div>`).join('')+
  `<div style="padding:8px 14px 2px"><div style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0 8px;border-bottom:1.5px solid var(--border);color:var(--muted)">🔵 東京Metro 地鐵</div></div>`+

renderFlights();updateBadge();
