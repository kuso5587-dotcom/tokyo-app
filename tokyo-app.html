async function runAI(){
  S.aiLoad=true;render();
  const D=derived();
  const list=D.allAdded.map(s=>s.name+"("+s.area+")").join("、");
  const prompt=list?`東京${S.numDays}天，景點：${list}。繁體中文，地鐵效率最佳動線、出發時間、美食推薦，分天清晰列出。`:`規劃東京${S.numDays}天IG打卡行程2026，繁體中文，分天列景點、地鐵路線、美食推薦。`;
  try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});const d=await r.json();S.aiText=d.content?.map(c=>c.text||"").join("")||"生成失敗";}
  catch(_){S.aiText="AI 連線失敗";}
  S.aiLoad=false;render();
}
